name: Firebase · pessoas de exemplo
# Dispara quando firebase/exemplos.json muda: {"projetos":["homolog"]}
on:
  push:
    branches: [main]
    paths: ['firebase/exemplos.json']
permissions: {contents: write}
jobs:
  exemplos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Criar pessoas de exemplo
        env:
          CHAVE_OFICIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CHAVE_HOMOLOG: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOMOLOG }}
        run: |
          cd firebase/importador && npm install --silent --no-audit --no-fund
          set -o pipefail
          : > "$RUNNER_TEMP/log.txt"
          for P in $(node -p "require('../exemplos.json').projetos.join(' ')"); do
            if [ "$P" = oficial ]; then printf '%s' "$CHAVE_OFICIAL" > "$RUNNER_TEMP/chave.json"; else printf '%s' "$CHAVE_HOMOLOG" > "$RUNNER_TEMP/chave.json"; fi
            GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/chave.json" node "$(node -p "require('../exemplos.json').script||'exemplos-usuarios.js'")" 2>&1 | tee -a "$RUNNER_TEMP/log.txt"
          done
      - name: Registrar resultado (branch firebase-log)
        if: always()
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: ./scripts/firebase-log.sh "exemplos" "${{ job.status }}"

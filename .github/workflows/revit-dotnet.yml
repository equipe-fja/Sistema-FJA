name: Revit · compilar biblioteca C#
# Compila revit/dotnet/FJA.Revit para o Revit 2024 (.NET Framework 4.8) e para o Revit 2027 (.NET 10)
# e grava as DLLs em revit/Ferramentas-FJA.extension/bin/R2024 e bin/R2027, com commit na mesma branch.
# Roda quando o código C# muda ou quando a versão da extensão (extension.json) muda — a DLL leva a mesma versão.
# A homologação não é republicada aqui: só sob demanda (ver firebase-publicar.yml).
on:
  push:
    paths:
      - 'revit/dotnet/**'
      - 'revit/Ferramentas-FJA.extension/extension.json'
      - '.github/workflows/revit-dotnet.yml'
  workflow_dispatch:
concurrency: revit-dotnet-${{ github.ref_name }}
permissions: {contents: write, actions: write}
jobs:
  compilar:
    runs-on: windows-latest
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - name: Compilar (R2024 e R2027)
        run: |
          set -euo pipefail
          VER=$(python -c "import json;print(json.load(open('revit/Ferramentas-FJA.extension/extension.json',encoding='utf-8'))['version'])")
          echo "versão da extensão: $VER"
          for R in 2024 2027; do
            dotnet build revit/dotnet/FJA.Revit/FJA.Revit.csproj -c Release -p:RevitVersion=$R -p:Version=$VER \
              -p:IncludeSourceRevisionInInformationalVersion=false -nologo -v:minimal
            DEST=revit/Ferramentas-FJA.extension/bin/R$R
            mkdir -p "$DEST"
            cp revit/dotnet/bin/R$R/FJA.Revit.dll revit/dotnet/bin/R$R/FJA.Revit.pdb "$DEST/"
          done
          ls -la revit/Ferramentas-FJA.extension/bin/*
      - name: Gravar as DLLs na branch
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add revit/Ferramentas-FJA.extension/bin
          if git diff --cached --quiet; then echo "DLLs iguais às da branch: nada a gravar"; echo "mudou=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Revit: biblioteca C# compilada (automático, ${GITHUB_SHA::7})"
          for t in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep 5
          done
          echo "mudou=1" >> "$GITHUB_OUTPUT"

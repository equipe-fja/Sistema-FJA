'@
function Escolher-FJA([string]$req) {
  $o = $req | ConvertFrom-Json
  $dono = New-Object System.Windows.Forms.Form
  $dono.TopMost = $true
  $dono.ShowInTaskbar = $false
  $dono.FormBorderStyle = 'None'
  $dono.StartPosition = 'Manual'
  $dono.Location = New-Object System.Drawing.Point(-3000, -3000)
  $dono.Size = New-Object System.Drawing.Size(1, 1)
  $dono.Show()
  Trazer-Frente $dono.Handle
  $dono.Activate()
  if ($o.tipo -eq 'pasta') {
    $ini = [string]$o.inicio
    while ($ini -and -not (Test-Path -LiteralPath $ini -PathType Container)) { $ini = Split-Path -Parent $ini }
    $p = $null
    try { $p = [FJA.Pasta]::Escolher($dono.Handle, [string]$o.titulo, $ini) }
    catch {
      $f = New-Object System.Windows.Forms.FolderBrowserDialog
      $f.Description = [string]$o.titulo
      if ($ini) { $f.SelectedPath = $ini }
      if ($f.ShowDialog($dono) -eq [System.Windows.Forms.DialogResult]::OK) { $p = $f.SelectedPath }
    }
    $dono.Dispose()
    if (-not $p) { return @{ cancelado = $true } }
    return @{ caminho = $p; pasta = $true }
  }
  $d = New-Object System.Windows.Forms.OpenFileDialog
  $d.Title = [string]$o.titulo
  $d.Multiselect = $false
  if ($o.tipo -eq 'planilha') {
    $d.Filter = 'Planilhas do Google (*.gsheet)|*.gsheet|Todos os arquivos (*.*)|*.*'
  } else {
    # truque para tambem aceitar pastas: entrar na pasta e clicar em Abrir com o nome sugerido
    $d.Filter = 'Todos os arquivos (*.*)|*.*'
    $d.CheckFileExists = $false
    $d.ValidateNames = $false
    $d.FileName = 'Selecionar esta pasta'
  }
  $ini = [string]$o.inicio
  while ($ini -and -not (Test-Path -LiteralPath $ini -PathType Container)) { $ini = Split-Path -Parent $ini }
  if ($ini) { $d.InitialDirectory = $ini }
  $r = $d.ShowDialog($dono)
  $dono.Dispose()
  if ($r -ne [System.Windows.Forms.DialogResult]::OK) { return @{ cancelado = $true } }
  $p = $d.FileName
  $pasta = $false
  if ((Split-Path -Leaf $p) -eq 'Selecionar esta pasta' -and -not (Test-Path -LiteralPath $p)) { $p = Split-Path -Parent $p; $pasta = $true }
  elseif (Test-Path -LiteralPath $p -PathType Container) { $pasta = $true }
  $res = @{ caminho = $p; pasta = $pasta }
  if ($p -match '\\.(gsheet|gdoc|gslides|gdraw|gform)$') {
    try {
      $j = Get-Content -LiteralPath $p -Raw -Encoding UTF8 | ConvertFrom-Json
      if ($j.doc_id) { $res.id = [string]$j.doc_id }
      if ($j.url) { $res.url = [string]$j.url }
    } catch {}
  }
  return $res
}
Add-Type -Namespace FJA -Name Clip -MemberDefinition '[DllImport("user32.dll")] public static extern uint GetClipboardSequenceNumber(); [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow(); [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h); [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid); [DllImport("user32.dll")] public static extern bool AttachThreadInput(uint idAttach, uint idAttachTo, bool fAttach); [DllImport("kernel32.dll")] public static extern uint GetCurrentThreadId(); [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int nCmdShow); [DllImport("user32.dll")] public static extern bool BringWindowToTop(IntPtr h);'
$mutex = New-Object System.Threading.Mutex($false, 'Local\\FJA_ConexaoPC_Vigia')
if (-not $mutex.WaitOne(0)) { exit }
$ult = [FJA.Clip]::GetClipboardSequenceNumber()
while ($true) {
  Start-Sleep -Milliseconds 300
  try {
    $n = [FJA.Clip]::GetClipboardSequenceNumber()
    if ($n -eq $ult) { continue }
    $ult = $n
    if (-not [System.Windows.Forms.Clipboard]::ContainsText()) { continue }
    $t = [System.Windows.Forms.Clipboard]::GetText()
    if ($t.StartsWith('fja-escolher:')) {
      # janela do navegador que pediu a escolha: o resultado volta para ela
      $nav = [FJA.Clip]::GetForegroundWindow()
      [System.Windows.Forms.Clipboard]::SetText('fja-escolhendo')
      try { $res = Escolher-FJA $t.Substring(13) } catch { $res = @{ erro = $_.Exception.Message } }
      [System.Windows.Forms.Clipboard]::SetText('fja-escolhido:' + ($res | ConvertTo-Json -Compress))
      $ult = [FJA.Clip]::GetClipboardSequenceNumber()
      # volta ao navegador e cola sozinho (o campo de recepcao do sistema esta em foco)
      if ($nav -ne [IntPtr]::Zero) {
        Trazer-Frente $nav
        Start-Sleep -Milliseconds 350
        if ([FJA.Clip]::GetForegroundWindow() -eq $nav) { [System.Windows.Forms.SendKeys]::SendWait('^v') }
      }
      continue
    }
    if (-not $t.StartsWith('fja-abrir:')) { continue }
    $p = $t.Substring(10).Trim()
    [System.Windows.Forms.Clipboard]::SetText($p)
    $ult = [FJA.Clip]::GetClipboardSequenceNumber()
    Abrir-FJA $p
  } catch {}
}
`;

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC_T[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
function zipArquivos(arqs){
  const enc=new TextEncoder(), partes=[], central=[]; let off=0;
  const d=new Date(), dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(), tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  for(const a of arqs){
    const nome=enc.encode(a.nome), dados=typeof a.dados==='string'?enc.encode(a.dados):a.dados, crc=crc32(dados);
    const h=new DataView(new ArrayBuffer(30)); h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true); h.setUint16(10,tm,true); h.setUint16(12,dt,true); h.setUint32(14,crc,true); h.setUint32(18,dados.length,true); h.setUint32(22,dados.length,true); h.setUint16(26,nome.length,true); h.setUint16(28,0,true);
    partes.push(new Uint8Array(h.buffer),nome,dados);
    const c=new DataView(new ArrayBuffer(46)); c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true); c.setUint16(12,tm,true); c.setUint16(14,dt,true); c.setUint32(16,crc,true); c.setUint32(20,dados.length,true); c.setUint32(24,dados.length,true); c.setUint16(28,nome.length,true); c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer),nome); off+=30+nome.length+dados.length;
  }
  const tamC=central.reduce((s,u)=>s+u.length,0), e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,arqs.length,true); e.setUint16(10,arqs.length,true); e.setUint32(12,tamC,true); e.setUint32(16,off,true);
  return new Blob([...partes,...central,new Uint8Array(e.buffer)],{type:'application/zip'});
}

function bkpLer(ref){

/* O Drive recusa envios grandes ("tool input is too large"): cada backup vira uma pasta com um arquivo por coleção,
   dividido em partes de até ~180 KB, e um 00-indice.json com os metadados, as configurações e a lista de partes. */
const BKP_MAX=180000;
async function bkpCriar(titulo,txt,parentId,pasta){
  const a=pasta?{title:titulo,contentMimeType:'application/vnd.google-apps.folder',parentId}:{title:titulo,parentId,textContent:txt,contentMimeType:'application/json',disableConversionToGoogleType:true};
  let ult; for(let t=0;t<3;t++){try{const r=await mcp.callTool('Google Drive','create_file',a,{cache:false}); const f=r?.payload||r||{}, id=f.id||f.file?.id; if(id) return {id,url:f.viewUrl||f.file?.viewUrl||''}; ult=new Error('o Drive não devolveu o arquivo')}catch(e){ult=e} await new Promise(r=>setTimeout(r,1500*(t+1)))}
  throw ult;
}
async function bkpGravar(obj){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  const nome=`${AMB_DEV?'DEV-':AMB==='firebase'&&!window.FJA_FB_VIRADA?'FB-':''}SISTEMA-FJA_BACKUP_${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}h${p(d.getMinutes())}`;
  const pasta=await bkpCriar(nome,'',BKP.pasta,true);
  const partes=[]; let bytes=0;
  for(const [col,docs] of Object.entries(obj.colecoes)){
    const ids=Object.keys(docs); let lote={}, tam=0, k=0;
    const fechar=async()=>{k++; const arq=`${col}-${String(k).padStart(2,'0')}.json`, txt=JSON.stringify({sistema:obj.sistema,formato:2,colecao:col,parte:k,docs:lote});
      await bkpCriar(arq,txt,pasta.id); partes.push({arquivo:arq,colecao:col,n:Object.keys(lote).length}); bytes+=txt.length; lote={}; tam=0};
    for(const id of ids){const t=JSON.stringify(docs[id]).length+id.length+6; if(tam&&tam+t>BKP_MAX) await fechar(); lote[id]=docs[id]; tam+=t}
    if(ids.length) await fechar();
  }
  const {colecoes,...meta}=obj, idx=JSON.stringify({...meta,formato:2,partes});
  await bkpCriar('00-indice.json',idx,pasta.id); bytes+=idx.length;
  return {nome,id:pasta.id,url:`https://drive.google.com/drive/folders/${pasta.id}`,bytes,partes:partes.length};
}

/* migração: todos os arquivos citados no banco (ids de 32 hex) num .zip, com o nome igual ao id */
async function migBaixarArquivos(){
  if(!downloads){toast('O download não está disponível nesta visualização.');return}
  const ids=new Set(), varrer=v=>{if(typeof v==='string'){if(/^[0-9a-f]{32}$/.test(v)) ids.add(v)} else if(v&&typeof v==='object') for(const x of Object.values(v)) varrer(x)};
  for(const v of Object.values(S)) if(v instanceof Map) for(const x of v.values()) varrer(x);
  const L=[...ids], arqs=[], falhas=[]; let bytes=0;
  for(let i=0;i<L.length;i++){
    BKP.migrando=`Baixando ${i+1} de ${L.length}…`; if(i%10===0) bkpUI();
    try{const r=await fetch('/_blob/'+L[i]); if(!r.ok) throw 0; const u=new Uint8Array(await r.arrayBuffer()); bytes+=u.length; arqs.push({nome:'ARQUIVOS/'+L[i],dados:u})}catch{falhas.push(L[i])}
  }
  arqs.push({nome:'ARQUIVOS/00-lista.txt',dados:`${arqs.length} arquivos, ${(bytes/1048576).toFixed(1)} MB\nnão encontrados (${falhas.length}):\n${falhas.join('\n')}\n`});
  BKP.migrando='Montando o .zip…'; bkpUI();
  try{const r=await downloads.save({filename:'SISTEMA-FJA_ARQUIVOS.zip',data:zipArquivos(arqs)}); if(r) toast(`${arqs.length-1} arquivos salvos (${(bytes/1048576).toFixed(0)} MB)${falhas.length?' · '+falhas.length+' não encontrados':''}`)}
  catch(e){toast('Não foi possível salvar o .zip: '+(e?.message||e))}
  finally{BKP.migrando=null; bkpUI()}
}

document.addEventListener('click',async ev=>{

    const em=($('acsEm')?.value||'').trim().toLowerCase(), nome=($('acsNome')?.value||'').trim(), nivel=$('acsNivel')?.value==='admin'?'admin':'usuario', empresa=($('acsEmp')?.value||'').replace(ACS_NOVO,''), senha=($('acsSenha')?.value||'').trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){toast('E-mail inválido');return}
    if(!nome){toast('Informe o nome');return}
    if(senha.length<8){toast('A senha provisória precisa ter pelo menos 8 caracteres');return}
    b.disabled=true;
    try{
      const uid=await fb.criarConta(em,senha);
      await db.collection('acessos').doc(uid).set({email:em,nome,nivel,empresa,trocarSenha:true,criadoPor:fb.perfil()?.email||'',em:Date.now()});
      try{await fb.fs.collection('senhasProvisorias').doc(uid).set({email:em,senha,em:Date.now()})}catch(e){console.warn('senha provisória',e)}
      ACS.criada={email:em,nome,senha}; ACS.senha=null; ACS.emp=''; renderMain();
    }catch(e){
      b.disabled=false;
      if(e?.code==='auth/email-already-in-use'){
        // conta antiga (ex.: login por link): fica liberada e é vinculada no próximo login da pessoa
        try{await db.collection('acessosPendentes').doc(em).set({email:em,nome,nivel,empresa,criadoPor:fb.perfil()?.email||'',em:Date.now()});
          ['acsEm','acsNome'].forEach(k=>{const el=$(k); if(el) el.value=''}); ACS.emp='';

        catch(x){toast('Não foi possível liberar: '+x.message)}
      } else toast('Não foi possível criar: '+fb.mensagemErro(e));

const SUG={filtro:'abertas',busca:'',ed:null};

const stSug=e=>{const s=e.status||'NOVA';return `<span class="st-cm st-${TOM_SUG[s]||'off'}">${esc(capCm(s))}</span>`};
function telaSug(h){
  const L=[...S.sugest.values()].sort(ordSug), nAb=L.filter(sugAberta).length, q=semAc(SUG.busca);

  if(!S.ro) h+=`<section class="sug-nova"><div class="sug-g">
      <label class="fl wide">Descrição<textarea class="fld" id="sugDesc" rows="3" placeholder="Descreva a sugestão: o que mudar, onde, e por quê"></textarea></label>

    <div class="search" style="margin:0;min-width:220px;flex:1;max-width:360px"><input id="sugBusca" type="search" placeholder="Buscar nas sugestões…" value="${esc(SUG.busca)}" aria-label="Buscar nas sugestões"></div></div>`;
  if(!vis.length) return h+`<div class="esp-vazio"><h2>${L.length?'Nenhuma sugestão neste filtro':'Nenhuma sugestão ainda'}</h2><p>${L.length?'Troque o filtro acima para ver as outras.':'Use o formulário acima para registrar a primeira.'}</p></div></div>`;
  h+=`<section class="sheet"><div class="tablewrap"><table class="list sug-t"><thead><tr><th style="width:104px">Data</th><th style="width:170px">Autor</th><th>Descrição</th><th style="width:190px">Status</th>${S.ro?'':'<th style="width:70px"></th>'}</tr></thead><tbody>`;

      <td>${ed?`<textarea class="fld" id="sugEdDesc" rows="4">${esc(e.descricao||'')}</textarea><div class="sug-ed-b"><button class="btn sm" data-act="sug-ed-cancel">Cancelar</button><button class="btn pri sm" data-act="sug-ed-ok" data-id="${esc(e.id)}">Salvar</button></div>`:`<span class="cm-txt">${esc(e.descricao||'')}</span>`}</td>

  }
  return h+`</tbody></table></div></section></div>`;

async function sugAcao(a,b){
  if(a==='sug'){ir({t:'sug'});return}
  if(a==='sug-filtro'){SUG.filtro=b.dataset.v;renderMain();return}
  if(S.ro) return;
  if(a==='sug-add'){
    const desc=($('sugDesc')?.value||'').trim(), autor=($('sugAutor')?.value||'').trim(), data=dBr($('sugData')?.value||'')||new Date().toLocaleDateString('pt-BR');
    if(!desc){toast('Escreva a descrição da sugestão');$('sugDesc')?.focus();return}
    if(autor) lsSet('fja.sug.autor',autor);
    const ref=sugColl().doc(), body={descricao:desc,autor,data,status:'NOVA',criadoEm:Date.now(),atualizadoEm:Date.now(),...(me?{criadoPor:me}:{})};
    try{await ref.set(body);S.sugest.set(ref.id,{...body,id:ref.id});if(!['abertas','todas','NOVA'].includes(SUG.filtro)) SUG.filtro='abertas';renderMain();renderTree();toast('Sugestão registrada')}
    catch(err){toast(err?.code==='invalid_argument'?'Você não tem permissão para registrar':'Não foi possível salvar.')}
  }
  else if(a==='sug-ed'){SUG.ed=b.dataset.id;renderMain();setTimeout(()=>$('sugEdDesc')?.focus(),0)}
  else if(a==='sug-ed-cancel'){SUG.ed=null;renderMain()}
  else if(a==='sug-ed-ok'){const id=b.dataset.id, desc=($('sugEdDesc')?.value||'').trim(); if(!desc){toast('A descrição não pode ficar vazia');return}
    await sugGravar(id,{descricao:desc,autor:($('sugEdAutor')?.value||'').trim(),data:dBr($('sugEdData')?.value||'')||S.sugest.get(id)?.data||''}); SUG.ed=null; renderMain(); toast('Sugestão salva')}
  else if(a==='sug-del'){
    if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Excluir?';setTimeout(()=>{if(b.isConnected){b.classList.remove('armed');b.innerHTML=IC.trash}},4000);return}
    try{await sugColl().doc(b.dataset.id).delete();S.sugest.delete(b.dataset.id);renderMain();renderTree();toast('Sugestão excluída')}catch{toast('Não foi possível excluir.')}}
}
async function sugGravar(id,upd){
  const e=S.sugest.get(id); if(!e||S.ro) return; const ant={...e}, x={...upd,atualizadoEm:Date.now(),...(me?{atualizadoPor:me}:{})};
  Object.assign(e,x); renderMain(); renderTree();
  try{await sugColl().doc(id).update(x)}catch(err){S.sugest.set(id,ant);renderMain();toast(err?.code==='invalid_argument'?'Você não tem permissão para editar':'Não foi possível salvar.')}
}

  ataColl().onSnapshot(snap=>{
    const m=new Map(); for(const d of snap.docs){const v=d.data(); if(v&&v.projeto) m.set(d.id,{...structuredClone(v),id:d.id})}
    if(ATA.pend&&S.atas.get(ATA.pend)) m.set(ATA.pend,S.atas.get(ATA.pend)); // edição local ainda não gravada
    const ed=document.activeElement?.closest?.('#ataEd'); S.atas=m;
    if(S.carregado){if(ed||S.dirty) renderTree(); else render()}
  },()=>{});
  rdColl().onSnapshot(snap=>{
    const m=new Map(); for(const d of snap.docs){const v=d.data(); if(v&&v.projeto) m.set(d.id,{...structuredClone(v),id:d.id})}
    for(const [id,u] of RD_PEND){const x=m.get(id); if(x) Object.assign(x,u)}
    S.rdocs=m;
    if(S.qdraft&&!S.dirty&&S.view.t==='reli'){const n=m.get(S.qdraft.id); if(n) S.qdraft=structuredClone(n)}
    if(S.carregado){if(S.dirty) renderTree(); else render()}
  },()=>{});
  pendColl().onSnapshot(snap=>{
    const m=new Map(); for(const d of snap.docs){const v=d.data(); if(v&&v.projeto) m.set(d.id,{...structuredClone(v),id:d.id})}
    S.pends=m;
    if(S.qdraft&&!S.dirty&&S.view.t==='peni'){const n=m.get(S.qdraft.id); if(n) S.qdraft=structuredClone(n)}
    if(S.carregado){if(S.dirty) renderTree(); else render()}
  },()=>{});
  comColl().onSnapshot(snap=>{
    const m=new Map(); for(const d of snap.docs){const v=d.data(); if(v&&v.projeto) m.set(d.id,{...structuredClone(v),id:d.id})}
    const velhos=[]; for(const e of m.values()) if(e.status&&e.status!==normStCm(e.status)){e.status=normStCm(e.status);velhos.push(e.id)}
    S.coment=m; setTimeout(detectarExtsCm,800);
    if(velhos.length&&!S.ro) velhos.forEach(id=>comColl().doc(id).update({status:m.get(id).status}).catch(()=>{}));
    if(S.qdraft&&!S.dirty&&S.view.t==='comi'){const n=m.get(S.qdraft.id); if(n) S.qdraft=structuredClone(n)}
    if(S.carregado){if(S.dirty) renderTree(); else render()}
  },()=>{});
  etsigColl().onSnapshot(snap=>{rvAgendar();const m=new Map(); for(const d of snap.docs){const v=d.data(); if(v&&v.sigla) m.set(d.id,{...v,id:d.id})} S.etsig=m; if(S.carregado&&!S.dirty) render()},()=>{});
  espbColl().onSnapshot(snap=>{rvAgendar();
    const m=new Map(); for(const d of snap.docs){const v=d.data(); if(v&&v.fja) m.set(d.id,{...structuredClone(v),id:d.id})}
    S.espb=m;
    if(S.edraft&&!S.dirty&&S.view.t==='espbi'){const n=m.get(S.edraft.id); if(n) S.edraft=structuredClone(n)}
    if(S.carregado){if(S.dirty) renderTree(); else render()}
  },()=>{});
  espColl().onSnapshot(snap=>{rvAgendar();
    const m=new Map(); for(const d of snap.docs){const v=d.data(); if(v&&v.projeto) m.set(d.id,{...structuredClone(v),id:d.id})}
    S.espec=m;
    if(S.qdraft&&!S.dirty&&S.view.t==='espi'){const n=m.get(S.qdraft.id); if(n) S.qdraft=structuredClone(n)}
    if(S.carregado){if(S.dirty) renderTree(); else render()}
  },()=>{});
  coll().onSnapshot(snap=>{
    const m=new Map(); for(const d of snap.docs){const v=d.data(); if(v&&SEC[v.secao]) m.set(d.id,{...structuredClone(v),id:d.id})}
    S.itens=m;
    if(!S.carregado){S.carregado=true;S.estado='ok';if(restaurarVista())return}
    if(S.draft && !S.dirty){const n=m.get(S.draft.id); S.draft=n?structuredClone(n):null}
    if(S.dirty){renderTree()} else render();
  },e=>{setConn('Conexão perdida','err');toast('A conexão com o sistema caiu. Recarregue a página.')});
})();
render();
</script>

</body></html>

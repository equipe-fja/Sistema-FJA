<title>Sistema FJA</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: explorer de pastas à esquerda, ficha editável à direita. Tema claro com o vermelho da marca FJ */
:root{
  --bg:#f6f6f5; --panel:#ffffff; --side:#fbfbfa; --ink:#1d1d1d; --muted:#5e5e5c; --faint:#8f8f8c;
  --line:#e2e2df; --line-strong:#c9c9c5; --accent:#8e1b1b; --accent-weak:#f7ecea; --accent-ink:#6e1414; --brand:#8e1b1b;
  --ok:#2e7340; --ok-bg:#e4f1e6; --warn:#8a5d05; --warn-bg:#f8efd9; --off:#6d6d6a; --off-bg:#ededeb; --danger:#b3261e; --danger-bg:#fbe7e5; --info:#2f5f8a; --info-bg:#e8eff6;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-family:var(--f-mono);font-size:12.5px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
header.top{display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.logo{width:34px;height:34px;border:1px solid var(--line-strong);display:grid;place-items:center;flex:none;background:#fff}
.logo b{font-family:Arial,"Helvetica Neue",sans-serif;font-weight:700;font-size:15px;color:var(--brand);letter-spacing:-.02em}
.brand{display:flex;flex-direction:column;gap:2px;line-height:1.1}
.brand .wm{font-family:Arial,"Helvetica Neue",sans-serif;font-size:13px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.brand .wm b{color:var(--ink);font-weight:700}
.brand .sys{font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--ink)}
.brand .sys span{color:var(--brand)}
.top .sp{flex:1}
.amb-tag{display:none}
.amb-dev header.top{background:repeating-linear-gradient(-45deg,#ffe9b8 0 16px,#ffdf98 16px 32px);border-bottom:2px solid #c98a00}
.amb-dev .amb-tag{display:inline-flex;align-items:center;background:#a86100;color:#fff;font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:999px;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.amb-dev .logo{outline:2px solid #a86100;outline-offset:1px}
.conn{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.conn::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
.conn.on::before{background:var(--ok)}.conn.err::before{background:var(--danger)}
.shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:0}
aside{background:var(--side);border-right:1px solid var(--line);overflow:auto;padding:12px 8px 24px max(8px,env(safe-area-inset-left,0px))}
.search{display:flex;align-items:center;gap:6px;margin:0 4px 10px;padding:0 10px;height:34px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;height:100%}
.search svg{flex:none;color:var(--faint)}
.tree{display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:5px 8px;border-radius:5px;min-height:30px}
.row:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.row.sel{background:var(--accent-weak);color:var(--accent-ink)}
.row .chev{width:14px;flex:none;color:var(--faint);transition:transform .15s;box-sizing:content-box;padding:4px;margin:-4px;border-radius:4px}
.row[data-tk] .chev:hover{color:var(--ink,#222);background:rgba(0,0,0,.06)}
.row .chev.open{transform:rotate(90deg)}
.row .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .cnt{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.secline{display:flex;align-items:center;margin-top:8px}
.secline:first-child{margin-top:0}
.sec-h{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.sec-h svg.ic,.sub-h svg.ic{flex:none;color:var(--accent)}
.sub-h{font-weight:500}
.secline.sub{margin-top:0}
.addbtn{width:28px;height:28px;border-radius:5px;display:grid;place-items:center;color:var(--muted);flex:none}
.addbtn:hover{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink)}
.pasta{padding-left:22px;color:var(--muted)}
.item{padding-left:44px}
.item .code{font-family:var(--f-mono);font-size:11.5px;color:var(--faint);flex:none}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.t-ok{--c:var(--ok);--cb:var(--ok-bg)}.t-warn{--c:var(--warn);--cb:var(--warn-bg)}.t-off{--c:var(--off);--cb:var(--off-bg)}.t-info{--c:var(--info);--cb:var(--info-bg)}
.dot{background:var(--c)}
.empty-tree{padding:4px 8px 6px 44px;font-size:12.5px;color:var(--faint)}
main{overflow:auto;min-width:0;position:relative}
main.tem-split{overflow:hidden;display:flex;flex-direction:column}
.split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 7px var(--sw,560px)}
.split-l,.split-r{overflow:auto;min-width:0;position:relative}
.split-r{background:var(--panel);border-left:1px solid var(--line);box-shadow:-6px 0 18px rgba(0,0,0,.05)}
.split-r>.page{max-width:none;padding-top:22px}
.split-div{cursor:col-resize;background:linear-gradient(90deg,transparent 3px,var(--line-strong) 3px,var(--line-strong) 4px,transparent 4px);position:relative;z-index:12}
.split-div:hover,body.split-arr .split-div{background:linear-gradient(90deg,transparent 2px,var(--accent) 2px,var(--accent) 5px,transparent 5px)}
body.split-arr,body.split-arr *{cursor:col-resize!important;user-select:none!important}
.split-x{position:absolute;top:12px;right:12px;z-index:5}
.split-r{container-type:inline-size}
@container (max-width:780px){.split-r .eq-top,.split-r .eq-top2{grid-template-columns:minmax(0,1fr)}.split-r .eq-top>:first-child{max-width:420px}}
@container (max-width:520px){.split-r .grid,.split-r .ov{grid-template-columns:minmax(0,1fr)}}
.split-l .esp-g>.esp-c.cm-aberto,.split-l tr.cm-aberto>td{background:var(--accent-weak)!important}
.split-l tr.cm-aberto>td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.page{max-width:none;padding-block:28px 0;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.crumb{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px;display:flex;gap:6px;flex-wrap:wrap}
.crumb button{color:inherit;text-transform:inherit;letter-spacing:inherit}
.crumb button:hover{color:var(--accent)}
h1{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.2;margin:0 0 4px;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:15px;margin:0;letter-spacing:.01em}
.lead{color:var(--muted);margin:0 0 22px;max-width:62ch}
.title-input{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.25;width:100%;border:0;border-bottom:1px dashed transparent;background:none;padding:2px 0;margin-bottom:12px}
.title-input:hover:not(:disabled){border-bottom-color:var(--line-strong)}
.title-input:focus{outline:none;border-bottom-color:var(--accent)}
.meta-row{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:26px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--cb);color:var(--c);white-space:nowrap}
.badge .dot{width:6px;height:6px}
label.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.fld,select.fld,textarea.fld{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:14px;color:var(--ink);min-height:36px}
textarea.fld{resize:vertical;min-height:84px;line-height:1.5}
.fld:hover:not(:disabled){border-color:var(--line-strong)}
.fld:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.fld:disabled{background:transparent;border-style:dashed}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:22px}
.sheet-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sheet-h .sp{flex:1}
.sheet-h .hint{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;padding:16px}
.grid .wide{grid-column:1/-1}
.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px;padding-top:18px}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
input[type=checkbox]{-webkit-appearance:none;appearance:none;flex:none;width:16px;height:16px;margin:0;display:inline-grid;place-content:center;background:#fff;border:1px solid var(--line-strong);border-radius:4px;cursor:pointer;vertical-align:middle;transition:background .12s,border-color .12s}
input[type=checkbox]::before{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg);opacity:0}
input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
input[type=checkbox]:checked::before{opacity:1}
input[type=checkbox]:hover:not(:disabled){border-color:var(--accent)}
input[type=checkbox]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=checkbox]:disabled{opacity:.5;cursor:default}
.path{display:flex;gap:6px}
.path .fld{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:6px;border:1px solid var(--line-strong);background:var(--panel);font-size:13.5px;white-space:nowrap}
.btn:hover{background:color-mix(in srgb,var(--ink) 5%,var(--panel))}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.pri:hover{background:color-mix(in srgb,var(--accent) 88%,var(--ink))}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:var(--panel)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.actions{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-block:12px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--line);margin-top:8px}
.actions .state{font-size:12.5px;color:var(--muted);flex:1;min-width:140px}
.actions.dirty .state{color:var(--warn)}
.foot-meta{font-size:12px;color:var(--faint);padding:0 0 18px}
table.list{width:100%;border-collapse:collapse;font-size:13.5px}
table.list th{text-align:left;font-weight:500;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:9px 16px;border-bottom:1px solid var(--line)}
table.list td{padding:9px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr:last-child td{border-bottom:0}
table.list tbody tr{cursor:pointer}
table.list tbody tr:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
table.list td.num{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.tablewrap{overflow-x:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:26px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--accent)}
.card .n{font-family:var(--f-display);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.card .k{font-size:13px;color:var(--muted)}
.card svg{color:var(--accent)}
.ov{border-top:1px solid var(--line);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.ov:first-of-type{border-top:0}
.ov-name{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ov-name b{font-weight:500}
.ov-name .p{font-size:12px;color:var(--faint)}
.office{font-size:13px;color:var(--muted);white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:36px}
.office.none{font-style:italic;color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:16px 16px 0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:999px;padding:3px 6px 3px 11px;font-size:13px;background:var(--panel)}
.chip button{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.chip button:hover{background:var(--danger-bg);color:var(--danger)}
.chip.link{padding-right:11px}
.chip.link:hover{border-color:var(--accent);color:var(--accent)}
.pad{padding:16px}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted);padding:14px 16px}
.f-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.4fr) auto;gap:8px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.f-row:first-child{border-top:0}
.f-row .ops{display:flex;gap:2px}
.icb{width:30px;height:30px;border-radius:5px;display:grid;place-items:center;color:var(--muted)}
.icb:hover{background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink)}
.icb.del:hover{background:var(--danger-bg);color:var(--danger)}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:8px;padding:10px 14px;margin-bottom:18px;font-size:13.5px}
.banner .sp{flex:1;min-width:180px}
.welcome{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:26px}
.step{border-top:2px solid var(--ink);padding-top:10px}
.step .k{font-family:var(--f-mono);font-size:11.5px;color:var(--accent);letter-spacing:.06em}
.step p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.toast .toast-desf{margin-left:12px;background:none;border:1px solid rgba(255,255,255,.45);color:inherit;border-radius:4px;padding:1px 8px;font-size:12px;cursor:pointer}
.toast .toast-desf:hover{background:rgba(255,255,255,.15)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 16px;border-radius:6px;font-size:13.5px;z-index:20}
.loading{padding:40px 28px;color:var(--muted)}
.menu-toggle{display:none}
@media (max-width:760px){
  html,body{height:auto}
  .app{height:auto;display:block}
  .shell{display:block}
  aside{max-height:46vh;border-right:0;border-bottom:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  aside.collapsed{display:none}
  .menu-toggle{display:inline-flex}

  .page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:20px}
  .actions{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .grid,.ov{grid-template-columns:minmax(0,1fr)}
  .f-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .f-row .ops{grid-column:1/-1;justify-content:flex-end}
  .conn span{display:none}
}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:16px}
.att{position:relative;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel);text-align:left}
.att:hover{border-color:var(--accent)}

.att .th canvas{object-fit:contain;background:#fff}
.att .th .ph{font-family:var(--f-mono);font-size:12px;color:var(--faint);letter-spacing:.08em}

.att .cap span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .kind{font-family:var(--f-mono);font-size:10.5px;color:var(--accent);flex:none}
.att .rm{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:5px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);color:var(--muted);opacity:0}
.att:hover .rm,.att .rm:focus-visible,.att .rm.armed{opacity:1}
.att .rm.armed{background:var(--danger);border-color:var(--danger);color:var(--panel);width:auto;padding:0 8px;font-size:12px}
.drop{margin:0 16px 16px;border:1.5px dashed var(--line-strong);border-radius:6px;padding:14px;text-align:center;color:var(--muted);font-size:13px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.drop.over{border-color:var(--accent);background:var(--accent-weak);color:var(--accent-ink)}
.drop.busy{opacity:.7}
.viewer{position:fixed;inset:0;z-index:30;background:rgba(10,13,12,.94);display:grid;grid-template-rows:auto minmax(0,1fr);color:#e8ecea}
.viewer[hidden]{display:none}
.vbar{display:flex;align-items:center;gap:8px;padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid rgba(255,255,255,.12)}
.vbar .vt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.vbar .vt small{color:#9aa5a1;margin-left:8px;font-family:var(--f-mono);font-size:11.5px}
.vbtn{height:32px;min-width:32px;padding:0 10px;border-radius:5px;border:1px solid rgba(255,255,255,.2);color:#e8ecea;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;text-decoration:none;white-space:nowrap}
.vbtn:hover{background:rgba(255,255,255,.1)}
.vbody{overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.vbody img{max-width:100%;max-height:calc(100vh - 110px);object-fit:contain;cursor:zoom-in;background:#fff}
.vbody img.full{max-width:none;max-height:none;cursor:zoom-out}
.vpages{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%}
.vpages canvas{background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.4);max-width:none}
.vmsg{color:#b8c2be;padding:40px 0;font-size:14px}

/* ---------- árvore ---------- */
function renderTree(){
  const q = S.busca.trim().toLowerCase();
  const selId = S.view.t==='item' ? S.view.id : null;
  const chev = ab => IC.chev.replace('class="chev"','class="chev'+(ab?' open':'')+'"');
  const secTree = (s, d) => {
    const ind = d*20;
    let lista = itensDe(s.id).sort(ordena);
    if(q) lista = lista.filter(i=>[i.nome,i.pasta,i.campos?.codigo,i.campos?.cliente].join(' ').toLowerCase().includes(q));
    const kS='s:'+s.id, abS = q || S.abertas.has(kS);
    const selS = (S.view.t==='secao'||S.view.t==='schema') && S.view.sec===s.id;
    let h=`<div class="secline${d?' sub':''}"><button class="row ${d?'sub-h':'sec-h'} ${selS?'sel':''}" style="padding-left:${8+ind}px" data-act="secao" data-sec="${s.id}" data-tk="${kS}" aria-expanded="${abS}">${chev(abS)}${IC[s.id]}<span class="lbl">${esc(s.nome)}</span><span class="cnt">${itensDe(s.id).length||''}</span></button>${S.ro?'':`<button class="addbtn" data-act="novo" data-sec="${s.id}" aria-label="Novo ${esc(s.um)}" title="Novo ${esc(s.um)}">${IC.plus}</button>`}</div>`;
    if(!abS) return h;
    if(!lista.length) return h+`<div class="empty-tree" style="padding-left:${44+ind}px">${q?'Nada encontrado':'Nenhum '+esc(s.um)+' ainda'}</div>`;
    const pastas = new Map();
    const PJ_AND='Em andamento', PJ_FIM='Concluídos e arquivados';
    if(s.id==='projetos'){pastas.set(PJ_AND,[]);pastas.set(PJ_FIM,[])}
    for(const i of lista){const p=s.id==='projetos'?(/^(Conclu|Arquiv)/i.test(i.status||'')?PJ_FIM:PJ_AND):(s.id==='parceiros'?(discsParc(i)[0]?discNome(discsParc(i)[0]):(i.pasta||'Sem disciplina')):(i.pasta||'Sem pasta'));if(!pastas.has(p))pastas.set(p,[]);pastas.get(p).push(i)}
    for(const [p,arr] of pastas){
      if(!arr.length&&(q||p===PJ_FIM)) continue;
      const kP='p:'+s.id+':'+p, def=s.id==='projetos'&&p===PJ_AND, selDentro=arr.some(i=>i.id===selId||(i.id===S.view.id&&S.view.t!=='item'&&S.view.t!=='secao'));
      const abP = q || (def?!S.fechadas.has(kP):S.abertas.has(kP)) || (selDentro&&!S.fx.has(kP));
      h+=`<button class="row pasta" style="padding-left:${22+ind}px" data-act="pasta" data-k="${esc(kP)}" data-tk="${esc(kP)}" ${def?'data-def="1"':''} aria-expanded="${abP}">${chev(abP)}<span class="lbl">${esc(p)}</span><span class="cnt">${arr.length}</span></button>`;
      if(!abP) continue;
      for(const i of arr){
        const cod = (s.id==='projetos'||s.id==='disciplinas') && i.campos?.codigo ? `<span class="code">${esc(i.campos.codigo)}</span>`:'';
        const proj=s.id==='projetos', ppSel=S.view.t==='pp'&&S.view.id===i.id;
        const abI=proj&&(S.abertas.has('i:'+i.id)||(ppSel&&!S.fx.has('i:'+i.id)));
        h+=`<button class="row item ${i.id===selId?'sel':''}" style="padding-left:${(proj?28:44)+ind}px" data-act="item" data-id="${esc(i.id)}" ${proj?`data-tk="i:${esc(i.id)}" aria-expanded="${abI}"`:''}>${proj?chev(abI):''}${cod}<span class="lbl">${esc(i.nome||'Sem nome')}</span><span class="dot ${TOM[i.status]||'t-off'}" title="${esc(i.status||'')}"></span></button>`;
        if(abI) for(const [k,n] of SUBPASTAS){
          const ps=(i.pastasArq?.[k]||[]).slice().sort(ordPastas);
          const abS2=S.abertas.has('ps:'+i.id+':'+k)||(ppSel&&S.view.sub===k&&!S.fx.has('ps:'+i.id+':'+k));
          const selS2=ppSel&&S.view.sub===k&&!S.view.data;
          h+=`<button class="row pasta ${selS2?'sel':''}" style="padding-left:${50+ind}px" data-act="pp" data-id="${esc(i.id)}" data-sub="${k}" data-tk="ps:${esc(i.id)}:${k}" aria-expanded="${abS2}">${chev(abS2)}<span class="lbl">${n}</span><span class="cnt">${nArqSub(i,k)||''}</span></button>`;
          if(!abS2) continue;
          if(!ps.length) h+=`<div class="empty-tree" style="padding-left:${86+ind}px">Sem pastas</div>`;
          for(const p of ps) h+=`<button class="row item dt ${ppSel&&S.view.sub===k&&S.view.data===chave(p)?'sel':''}" style="padding-left:${86+ind}px" data-act="pp" data-id="${esc(i.id)}" data-sub="${k}" data-data="${esc(chave(p))}" title="${esc(fmtDia(p.data)+(p.nota?' · '+p.nota:''))}"><span class="lbl"><span class="mono">${fmtDia(p.data)}</span>${p.nota?` <span class="desc">${esc(p.nota)}</span>`:''}</span><span class="cnt">${(p.arquivos||[]).length||''}</span></button>`;
        }
        if(abI){const nd=discsProj(i.id).length, seld=S.view.t==='disc'&&S.view.id===i.id;
          h+=`<button class="row pasta ${seld?'sel':''}" style="padding-left:${50+ind}px" data-act="disc" data-id="${esc(i.id)}"><span class="chev"></span><span class="lbl">Disciplinas e equipe</span><span class="cnt">${nd||''}</span></button>`}
        if(abI){const n=espDe(i.id).length, sel=(S.view.t==='esp'||S.view.t==='espi')&&S.view.id===i.id;
          const nq=eqDe(i.id).length, selq=(S.view.t==='eq'||S.view.t==='eqi')&&S.view.id===i.id;
          const abE=S.abertas.has('es:'+i.id)||(selq&&!S.fx.has('es:'+i.id));
          h+=`<button class="row pasta ${sel?'sel':''}" style="padding-left:${50+ind}px" data-act="esp" data-id="${esc(i.id)}" data-tk="es:${esc(i.id)}" aria-expanded="${abE}">${chev(abE)}<span class="lbl">Especificação técnica</span><span class="cnt">${n||''}</span></button>`;
          if(abE) h+=`<button class="row item ${selq?'sel':''}" style="padding-left:${86+ind}px" data-act="eq" data-id="${esc(i.id)}"><span class="lbl">Equipamentos</span><span class="cnt">${nq||''}</span></button>`;
          const nc=comDe(i.id).length, selc=(S.view.t==='com'||S.view.t==='comi')&&S.view.id===i.id;
          h+=`<button class="row pasta ${selc?'sel':''}" style="padding-left:${50+ind}px" data-act="com" data-id="${esc(i.id)}"><span class="chev"></span><span class="lbl">Comentários</span><span class="cnt">${nc||''}</span></button>`;
          const np=pdDe(i.id).length, selp=(S.view.t==='pen'||S.view.t==='peni')&&S.view.id===i.id;
          h+=`<button class="row pasta ${selp?'sel':''}" style="padding-left:${50+ind}px" data-act="pen" data-id="${esc(i.id)}"><span class="chev"></span><span class="lbl">Pendências/Histórico</span><span class="cnt">${np||''}</span></button>`;
          const nd=rdDe(i.id).length, seld=(S.view.t==='rel'||S.view.t==='reli')&&S.view.id===i.id;
          h+=`<button class="row pasta ${seld?'sel':''}" style="padding-left:${50+ind}px" data-act="rel" data-id="${esc(i.id)}"><span class="chev"></span><span class="lbl">Relação de documentos</span><span class="cnt">${nd||''}</span></button>`;
          const na=atasDe(i.id).length, sela=(S.view.t==='atas'||S.view.t==='atai')&&S.view.id===i.id;
          h+=`<button class="row pasta ${sela?'sel':''}" style="padding-left:${50+ind}px" data-act="atas" data-id="${esc(i.id)}"><span class="chev"></span><span class="lbl">Atas de reunião</span><span class="cnt">${na||''}</span></button>`;
          const nq2=croqsDe(i.id).length, selq2=(S.view.t==='croqs'||S.view.t==='croqi')&&S.view.id===i.id;
          h+=`<button class="row pasta ${selq2?'sel':''}" style="padding-left:${50+ind}px" data-act="croqs" data-id="${esc(i.id)}"><span class="chev"></span><span class="lbl">Croquis</span><span class="cnt">${nq2||''}</span></button>`;
          const nr=croDe(i.id).length, selr=S.view.t==='cro'&&S.view.id===i.id;
          h+=`<button class="row pasta ${selr?'sel':''}" style="padding-left:${50+ind}px" data-act="cro" data-id="${esc(i.id)}"><span class="chev"></span><span class="lbl">Cronograma</span><span class="cnt">${nr||''}</span></button>`}
      }
    }
    return h;
  };
  let h='';
  for(const t of TOPO){
    const g=GRUPOS[t];
    if(!g){h+=secTree(SEC[t],0);continue}
    const kG='g:'+t, abG = q || S.abertas.has(kG);
    const n=g.filhos.reduce((a,f)=>a+itensDe(f).length,0);
    h+=`<div class="secline"><button class="row sec-h ${S.view.t==='grupo'&&S.view.g===t?'sel':''}" data-act="grupo" data-g="${t}" data-tk="${kG}" aria-expanded="${abG}">${chev(abG)}${IC[t]}<span class="lbl">${esc(g.nome)}</span><span class="cnt">${n||''}</span></button></div>`;
    if(abG) for(const f of g.filhos) h+=secTree(SEC[f],1);
    if(abG&&t==='biblioteca') h+=`<div class="secline sub"><button class="row sub-h ${S.view.t==='espb'||S.view.t==='espbi'||S.view.t==='etsig'?'sel':''}" style="padding-left:28px" data-act="espb"><span class="chev"></span>${IC.manuais}<span class="lbl">Especificação técnica</span><span class="cnt">${S.espb.size||''}</span></button></div>`;
    if(abG&&t==='biblioteca'){const kF='s:ferramentas', abF=S.abertas.has(kF)||(S.view.t==='ferr'&&!!S.view.f&&!S.fx.has(kF)), selF=S.view.t==='ferr'&&!S.view.f;
      h+=`<div class="secline sub"><button class="row sub-h ${selF?'sel':''}" style="padding-left:28px" data-act="ferr" data-tk="${kF}" aria-expanded="${abF}">${chev(abF)}${IC.ferr}<span class="lbl">Ferramentas</span><span class="cnt">${FERRAMENTAS.length}</span></button></div>`;
      if(abF) for(const x of FERRAMENTAS) h+=`<button class="row item ${S.view.t==='ferr'&&S.view.f===x.id?'sel':''}" style="padding-left:64px" data-act="ferr" data-f="${x.id}"><span class="lbl">${esc(x.nome)}</span>${x.id==='pc'&&pcAtivo()?'<span class="dot t-ok" title="Ativa neste computador"></span>':''}</button>`}
  }
  {const kM='s:manut', abM=S.abertas.has(kM)||(S.view.t==='manut'&&!!S.view.f&&!S.fx.has(kM)), selM=S.view.t==='manut'&&!S.view.f;
   h+=`<div class="secline"><button class="row sec-h ${selM?'sel':''}" data-act="manut" data-tk="${kM}" aria-expanded="${abM}">${chev(abM)}${IC.manut}<span class="lbl">Manutenção</span><span class="cnt">${MANUT.length||''}</span></button></div>`;
   if(abM) for(const x of MANUT) h+=`<button class="row item ${S.view.t==='manut'&&S.view.f===x.id?'sel':''}" style="padding-left:44px" data-act="manut" data-f="${x.id}"><span class="lbl">${esc(x.nome)}</span></button>`}
  {const nS=[...S.sugest.values()].filter(sugAberta).length;
   h+=`<div class="secline sug-line"><button class="row sec-h ${S.view.t==='sug'?'sel':''}" data-act="sug"><span class="chev"></span>${IC.sug}<span class="lbl">Sugestões</span><span class="cnt" title="Sugestões em aberto">${nS||''}</span></button></div>`}
  $('tree').innerHTML=h;
  try{const v=JSON.stringify([...S.abertas]); if(v!==S._abSalvo){localStorage.setItem('fja.abertas',v); S._abSalvo=v}}catch{}
}

/* ---------- campos ---------- */
function campoHTML(f, val){
  const dis = S.ro?'disabled':'';
  const id = 'c_'+f.key;
  const v = val??'';
  switch(f.type){
    case 'longtext': return `<label class="fl wide" for="${id}">${esc(f.label)}<textarea class="fld" id="${id}" data-f="c:${esc(f.key)}" rows="4" ${dis}>${esc(v)}</textarea></label>`;
    case 'select': {
      const ops=(f.options||[]); const extra = v && !ops.includes(v) ? [v]:[];
      return `<label class="fl" for="${id}">${esc(f.label)}<select class="fld" id="${id}" data-f="c:${esc(f.key)}" ${dis}><option value="">—</option>${[...ops,...extra].map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;
    }
    case 'discs': return campoDiscsHTML(f,val);
    case 'color': {const c=/^#[0-9a-f]{6}$/i.test(v)?v:(dCorSug||'#999999'); return `<label class="fl" for="${id}">${esc(f.label)}<span class="cor-fld"><input type="color" id="${id}" data-f="c:${esc(f.key)}" value="${esc(c)}" ${dis}><span class="mono">${esc(c)}</span>${v?'':'<span class="muted" style="font-size:12px">sugerida</span>'}</span></label>`}
    case 'checkbox': return `<label class="fl chk" for="${id}"><input type="checkbox" id="${id}" data-f="c:${esc(f.key)}" ${v?'checked':''} ${dis}>${esc(f.label)}</label>`;
    case 'date': return `<label class="fl" for="${id}">${esc(f.label)}<input class="fld" type="date" id="${id}" data-f="c:${esc(f.key)}" value="${esc(v)}" ${dis}></label>`;
    case 'number': return `<label class="fl" for="${id}">${esc(f.label)}<input class="fld" type="number" id="${id}" data-f="c:${esc(f.key)}" value="${esc(v)}" ${dis}></label>`;
    case 'path': return `<label class="fl wide" for="${id}">${esc(f.label)}<span class="path"><input class="fld mono" id="${id}" data-f="c:${esc(f.key)}" value="${esc(v)}" placeholder="\\\\servidor\\BIM\\..." ${dis}><button class="btn sm" type="button" data-act="copiar" data-src="${id}" title="Copiar caminho">${IC.copy}Copiar</button></span></label>`;
    case 'url': return `<label class="fl wide" for="${id}">${esc(f.label)}<span class="path"><input class="fld" id="${id}" data-f="c:${esc(f.key)}" value="${esc(v)}" placeholder="https://" ${dis}>${/^https?:\/\//.test(v)?`<a class="btn sm" href="${esc(v)}" target="_blank" rel="noopener">Abrir</a>`:''}</span></label>`;
    default: return `<label class="fl" for="${id}">${esc(f.label)}<input class="fld" id="${id}" data-f="c:${esc(f.key)}" value="${esc(v)}" ${dis}></label>`;
  }
}

function renderMain(){
  const m=$('main');
  if(S.estado==='indisponivel'){m.innerHTML=`<div class="page"><h1>Sistema FJA indisponível</h1><p class="lead">O banco de dados do sistema não abriu nesta visualização. Entre com sua conta do Claude e abra a página pelo link compartilhado do escritório.</p></div>`;return}
  if(!S.carregado){m.innerHTML='<div class="loading">Carregando o Sistema FJA…</div>';return}
  const v=S.view; let h='';
  if(S.pend) h+=bannerPend();
  if(v.t==='home') h=telaHome(h);
  else if(v.t==='grupo') h=telaGrupo(h,v.g);
  else if(v.t==='secao') h=telaSecao(h,v.sec);
  else if(v.t==='schema') h=telaSchema(h,v.sec);

async function gravarPasta(id,sub,fn){
  const it=S.itens.get(id); if(!it) throw new Error('sem item');
  const pastas=structuredClone(it.pastasArq?.[sub]||[]);

const canvasJpg=(c,q)=>new Promise((ok,err)=>c.toBlob(b=>b?ok(b):err(new Error('jpg')),'image/jpeg',q));
function reduz(src,w0,h0,max){
  const s=Math.min(1,max/Math.max(w0,h0)); const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w0*s)); c.height=Math.max(1,Math.round(h0*s));
  const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(src,0,0,c.width,c.height); return c;
}
async function gerarPrevia(f,maxImg){
  if(f.type==='application/pdf'){
    const L=await carregarPdfjs();
    const pdf=await L.getDocument({data:new Uint8Array(await f.arrayBuffer()),isEvalSupported:false}).promise;
    const n=Math.min(pdf.numPages,40), larg=pdf.numPages===1?3000:1800, pags=[]; let thumb=null;
    for(let i=1;i<=n;i++){
      const pg=await pdf.getPage(i); const v0=pg.getViewport({scale:1}); const v=pg.getViewport({scale:larg/v0.width});
      const c=document.createElement('canvas'); c.width=Math.floor(v.width); c.height=Math.floor(v.height);
      const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
      await pg.render({canvasContext:g,viewport:v}).promise;
      pags.push(await canvasJpg(c,.8));
      if(i===1) thumb=await canvasJpg(reduz(c,c.width,c.height,480),.78);
      c.width=c.height=0;
    }
    return {pags,thumb,paginas:pdf.numPages};
  }
  const bmp=await createImageBitmap(f);
  const prev=await canvasJpg(reduz(bmp,bmp.width,bmp.height,maxImg||2000),.82);
  const thumb=await canvasJpg(reduz(bmp,bmp.width,bmp.height,480),.78);
  bmp.close?.();
  return {pags:[prev],thumb,paginas:1};
}
async function subirPrevia(f,maxImg){
  const g=await gerarPrevia(f,maxImg);
  const ids=[]; for(const b of g.pags) ids.push((await assets.upload(b,{type:'image/jpeg'})).id);
  const tid=(await assets.upload(g.thumb,{type:'image/jpeg'})).id;
  return {nome:f.name,tipo:f.type,tamanho:f.size,prev:ids[0],thumb:tid,...(ids.length>1?{pags:ids}:{}),...(g.paginas>ids.length?{paginasTotal:g.paginas}:{}),enviadoEm:Date.now(),...(me?{enviadoPor:me}:{})};
}
async function gravarCtx(ctx,fn){
  if(ctx==='peb'){
    const d=S.draft, it=S.itens.get(d.id); const cur=it?.padronizacao?.peb; const l=cur?[cur]:[]; fn(l);
    const peb=l.length?l[l.length-1]:null;
    await coll().doc(d.id).update({padronizacao:{peb}});
    pad(d).peb=peb; if(it) it.padronizacao={...(it.padronizacao||{}),peb};
    if(cur&&peb!==cur) for(const x of idsDe(cur)) if(!arquivoEmUso(x)){try{await assets.delete(x)}catch{}}
    return;
  }
  if(ctx==='item'){
    const d=S.draft; const lista=structuredClone(S.itens.get(d.id)?.arquivos||[]); fn(lista);
    await coll().doc(d.id).update({arquivos:lista});
    d.arquivos=lista; const it=S.itens.get(d.id); if(it) it.arquivos=lista; return;
  }
  const [,id,sub,data]=ctx.split('|');
  await gravarPasta(id,sub,ps=>{let p=ps.find(x=>chave(x)===data); if(!p){p={data,arquivos:[]};ps.push(p)} p.arquivos=p.arquivos||[]; fn(p.arquivos)});
}
async function enviarArquivos(files,ctx){
  if(!assets||!ctx) return;
  if(ctx==='esp'){imagemEsp(files);return}
  if(ctx==='eqds'){enviarDatasheet(files);return}
  if(ctx==='eqcapa'){enviarCapaEq(files);return}
  const drop=document.querySelector(`.drop[data-ctx="${CSS.escape(ctx)}"]`);
  const status=t=>{if(drop){drop.classList.add('busy');drop.firstElementChild.textContent=t}};
  if(ctx==='capa'){const f=[...files].find(x=>/^image\//.test(x.type)&&TIPOS_ARQ.includes(x.type)); if(!f){toast('Escolha uma imagem PNG, JPG, GIF ou WebP');return}
    status('Gerando a prévia da capa…');
    try{const e=await subirPrevia(f,2400);try{await assets.delete(e.thumb)}catch{} await definirCapa(S.draft,{id:e.prev,nome:f.name,propria:true});S.capaPick=false;toast('Capa atualizada')}catch(e){toast('Não foi possível usar esta imagem')}
    renderMain();return}
  const ok=[...files].filter(f=>ctx==='peb'?f.type==='application/pdf':TIPOS_ARQ.includes(f.type));
  if(ctx==='peb'&&!ok.length){toast('O PEB precisa ser um PDF');return}
  if(ok.length<files.length) toast('Só imagens (PNG, JPG, GIF, WebP) e PDFs geram prévia. Para outros arquivos, adicione o caminho no servidor.');
  if(!ok.length) return;
  const novos=[];
  for(let i=0;i<ok.length;i++){
    const f=ok[i]; status(`Gerando prévia ${i+1} de ${ok.length}: ${f.name}…`);
    try{novos.push(await subirPrevia(f))}
    catch(e){toast(e?.code==='quota_or_state'?'O espaço de arquivos do sistema está cheio':`Não foi possível gerar a prévia de “${f.name}”`)}
  }
  if(novos.length){
    try{await gravarCtx(ctx,l=>l.push(...novos));toast(novos.length>1?novos.length+' prévias adicionadas':'Prévia adicionada')}
    catch{toast('As prévias foram geradas mas não ficaram vinculadas. Tente de novo.')}
  }
  render();
}
function arquivoEmUso(assetId){
  const tem=x=>x&&idsDe(x).includes(assetId);
  for(const it of S.itens.values()){
    if((it.arquivos||[]).some(tem)) return true;
    if(tem(it.padronizacao?.peb)) return true;
    if(it.capa?.id===assetId) return true;
  }
  for(const e of S.espec.values()) if(e.imagem&&idsDe(e.imagem).includes(assetId)) return true;
  for(const e of S.equip.values()) if((e.datasheet&&idsDe(e.datasheet).includes(assetId))||(e.capa&&idsDe(e.capa).includes(assetId))) return true;
  for(const e of S.coment.values()) if((e.capa&&idsDe(e.capa).includes(assetId))||(e.pdf&&idsDe(e.pdf).includes(assetId))) return true;
  for(const it of S.itens.values()){
    for(const ps of Object.values(it.pastasArq||{})) for(const p of ps||[]) if((p.arquivos||[]).some(tem)) return true;
  }
  return false;
}
async function removerArquivo(ctx,i){
  const a=listaCtx(ctx)[i]; if(!a) return;
  const mesmo=x=>(a.prev&&x.prev===a.prev)||(a.id&&x.id===a.id)||(a.ref&&x.ref===a.ref);
  try{await gravarCtx(ctx,l=>{const k=l.findIndex(mesmo);if(k>=0)l.splice(k,1)})}
  catch{toast('Não foi possível remover.');return}
  for(const x of idsDe(a)) if(!arquivoEmUso(x)){try{await assets.delete(x)}catch{}}
  toast('Arquivo removido');render();
}
let pdfjsP=null; const thumbCache=new Map();
function carregarPdfjs(){
  if(pdfjsP) return pdfjsP;
  const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  const load=src=>new Promise((ok,err)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=err;document.head.appendChild(s)});
  pdfjsP=load(base+'pdf.min.js').then(()=>load(base+'pdf.worker.min.js')).then(()=>{
    if(!window.pdfjsWorker && window['pdfjs-dist/build/pdf.worker']) window.pdfjsWorker=window['pdfjs-dist/build/pdf.worker'];
    const L=window.pdfjsLib; L.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js'; return L;
  });
  pdfjsP.catch(()=>{pdfjsP=null});
  return pdfjsP;
}
const docCache=new Map();
async function abrirPdf(id){
  if(docCache.has(id)) return docCache.get(id);
  const L=await carregarPdfjs();
  const p=L.getDocument({url:'/_blob/'+id,isEvalSupported:false}).promise;
  docCache.set(id,p); p.catch(()=>docCache.delete(id));
  return p;
}
async function desenharMiniaturas(){
  for(const c of document.querySelectorAll('canvas[data-pdfthumb]')){
    const id=c.dataset.pdfthumb;
    try{
      if(!thumbCache.has(id)){
        const pdf=await abrirPdf(id); const pg=await pdf.getPage(1);
        const v0=pg.getViewport({scale:1}); const sc=360/v0.width; const v=pg.getViewport({scale:sc});
        const off=document.createElement('canvas'); off.width=v.width; off.height=v.height;
        await pg.render({canvasContext:off.getContext('2d'),viewport:v}).promise;
        thumbCache.set(id,off);
      }
      if(!c.isConnected) continue;
      const src=thumbCache.get(id); c.width=src.width; c.height=src.height; c.getContext('2d').drawImage(src,0,0);
    }catch{ if(c.isConnected) c.replaceWith(Object.assign(document.createElement('span'),{className:'ph',textContent:'PDF'})) }
  }
}

function imagensProjeto(it){

    for(const p of ps) for(const a of p.arquivos||[]) if((a.prev||a.id)&&!ehPdf(a)&&!ehRef(a)) out.push({...a,id:a.prev||a.id,original:originalDe(a,`pp|${it.id}|${k}|${chave(p)}`),onde:n+' · '+fmtDia(p.data)});

function posFiltroPop(){

const CQ_MAX=25*1048576;
async function cqAdicionar(c,files){

  const fila=[...cqCarr(c),...files.map(f=>f.name)]; CQ.carr.set(c.id,fila); if(cqAtual()?.id===c.id) renderMain();
  let pasta=null; try{pasta=await cqPastaDrive(c)}catch(e){toast(e?.message||'Não foi possível criar a pasta no Drive')}
  if(!pasta) toast('Sem pasta no Drive: imagens e PDFs ficam só no sistema');
  let ok=0;
  for(const f of files){
    msg(`Enviando ${f.name}…`); CQ.subindo++;
    const a={nome:f.name,tipo:f.type||'',tamanho:f.size,em:Date.now(),...(me?{por:me}:{})};
    try{
      if(/^image\/|application\/pdf/.test(f.type)&&assets){try{const p=await subirPrevia(f,2000); a.prev=p.prev; a.thumb=p.thumb; if(p.pags) a.pags=p.pags}catch(e){console.warn('previa',e)}}
      if(pasta){ if(f.size>CQ_MAX){toast(`${f.name}: grande demais para enviar pelo sistema (${tamTxt(f.size)}). Salve-o na pasta pelo G: e use "Vincular do G:".`)}
        else{const buf=await f.arrayBuffer(); const r=await mcp.callTool(GD,'create_file',{title:f.name,contentMimeType:f.type||'application/octet-stream',base64Content:b64(buf),disableConversionToGoogleType:true,parentId:pasta.id},{cache:false}); const x=r?.payload||{}; a.driveId=x.id||x.file?.id||''; a.mime=x.mimeType||f.type}}
      if(a.driveId||a.prev){(c.arquivos=c.arquivos||[]).push(a); ok++}
    }catch(e){console.error(e); toast(`${f.name}: ${e?.message&&!e.code?e.message:msgMcp(e).replace(/Google Sheets/g,'Google Drive')}`)}
    finally{CQ.subindo--; const q=cqCarr(c); const k=q.indexOf(f.name); if(k>=0) q.splice(k,1); if(!q.length) CQ.carr.delete(c.id); if(cqAtual()?.id===c.id) renderMain()}
  }
  msg(''); if(ok){cqMudou(true); toast(ok>1?`${ok} arquivos adicionados`:'Arquivo adicionado')}
}

function lerTabelaEq(values){
  let hi=-1, cols=null;
  for(let i=0;i<Math.min(values.length,60);i++){
    const n=(values[i]||[]).map(normH);
    if(n.includes('ITEM')&&n.includes('SETOR')){hi=i;cols=n;break}
  }
  if(hi<0) throw {code:'formato',message:'Não encontrei a linha de cabeçalho (com as colunas ITEM e SETOR) nas primeiras 60 linhas da aba.'};
  const map={}; cols.forEach((h,j)=>{if(!h)return;for(const [t,k] of REGRAS_EQ){if(t(h)&&!(k in map)){map[k]=j;break}}});
  if(!('nome' in map)) throw {code:'formato',message:'Não encontrei a coluna com o nome do equipamento.'};
  const linhas=[];
  for(let i=hi+1;i<values.length;i++){
    const r=values[i]||[]; const g=k=>k in map?String(r[map[k]]??'').trim():'';
    if(!g('nome')) continue;
    const e={};
    for(const k of Object.keys(map)){
      const v=g(k);
      if(BOOL_EQ.has(k)) e[k]=/^(TRUE|VERDADEIRO|SIM|S|X|1)$/i.test(v);
      else if(NUM_EQ.has(k)) e[k]=numBR(v);
      else e[k]=/^(TRUE|FALSE|VERDADEIRO|FALSO)$/i.test(v)?'':v==='-'&&k!=='subdep'&&k!=='tamanho'?'':v;
    }
    e.linha=i+1; linhas.push(e);
  }
  return {linhas,cabecalho:hi+1,colunas:Object.keys(map).length};
}
const estavel=o=>JSON.stringify(Object.keys(o).sort().reduce((a,k)=>(a[k]=o[k],a),{}));
async function sincronizarEq(pid){
  const md=M(), it=S.itens.get(pid), o=it?.[md.origKey]; const box=$('syncMsg');
  const status=(t,cls)=>{if(box){box.textContent=t;box.className='sync-msg '+(cls||'')}};
  if(!o?.planilha||!o?.aba){status('Informe o link da planilha e o nome da aba.','err');return}
  if(!mcp){status(msgMcp({code:'not_granted'}),'err');return}
  if(S.syncando) return; S.syncando=true; const btn=$('btnSync'); if(btn){btn.disabled=true;btn.classList.add('girando')}
  try{
    const range=`'${o.aba.replace(/'/g,"''")}'!A1:BZ5000`;
    const r=await mcp.callTool(GS,'get_values',{spreadsheetId:o.planilha,range},{cache:false});
    const vals=r?.payload?.values||r?.structuredContent?.values;
    if(!Array.isArray(vals)) throw {code:'formato',message:'A resposta do Google Sheets veio num formato inesperado.'};
    const {linhas,cabecalho}=md.ler(vals);
    status(`Lidas ${linhas.length} linhas. Gravando…`);
    const usados=new Set(), alvo=new Map();
    for(const e of linhas){
      let id=md.idDe(e,pid); if(usados.has(id)) id+='__L'+e.linha; usados.add(id);
      alvo.set(id,{...e,projeto:pid,origem:{planilha:o.planilha,aba:o.aba,linha:e.linha}});
    }
    md.prep?.(alvo,pid);
    const atuais=md.de(pid); let novos=0,alterados=0,removidos=0,iguais=0,feitos=0,erros=0,mantidos=0;
    const tarefas=[];
    for(const [id,body] of alvo){
      const cur=md.mapa().get(id);
      if(cur&&cur.editadoLocal){mantidos++;continue}
      if(cur){const rest={...cur};for(const k of ['id','atualizadoEm','atualizadoPor','sincronizadoEm','editadoLocal','criadoEm','criadoPor',...md.locais]) delete rest[k]; if(estavel(rest)===estavel(body)){iguais++;continue} alterados++}
      else novos++;
      const loc=Object.fromEntries(md.locais.filter(k=>cur?.[k]).map(k=>[k,cur[k]])); tarefas.push(()=>md.coll().doc(id).set({...body,...loc,sincronizadoEm:Date.now()}));
    }
    for(const e of atuais) if(!alvo.has(e.id)) removidos++;
    const total=tarefas.length; let k=0;
    const worker=async()=>{while(k<tarefas.length){const t=tarefas[k++];try{await t()}catch(err){erros++;if(err?.code==='quota_exceeded'||err?.code==='invalid_argument'){k=tarefas.length}}feitos++;if(feitos%20===0||feitos===total)status(`Gravando ${feitos} de ${total}…`)}};
    await Promise.all(Array.from({length:Math.min(6,total)},worker));
    const resumo={...o,sincronizadoEm:Date.now(),linhas:linhas.length,cabecalho,novos,alterados,mantidos,erros,...(me?{sincronizadoPor:me}:{})};
    await coll().doc(pid).update({[md.origKey]:resumo}); it[md.origKey]=resumo;
    const extra=(mantidos?` · ${mantidos} editados no sistema foram mantidos`:'')+(removidos?` · ${removidos} itens do sistema não estão na planilha e foram mantidos`:'');
    status((erros?`Importado com ${erros} erro${erros>1?'s':''}: `:'Importado: ')+`${novos} novos, ${alterados} atualizados, ${iguais} sem mudança${extra}.`,erros?'err':'ok');
    toast('Importação concluída');
    {const mo=Object.keys(ESP).find(m=>ESP[m].proj&&MODS[m]===md); if(mo) setTimeout(()=>espAssumir(mo,pid),500)}
  }catch(e){status(e?.code==='formato'?e.message:msgMcp(e),'err')}
  finally{S.syncando=false; const b=$('btnSync'); if(b){b.disabled=false;b.classList.remove('girando')}; const t=$('eqTabela'); if(t) t.innerHTML=eqTabelaHTML(pid)}
}

/* confirmação própria: confirm() do navegador é bloqueado dentro do claude.ai (devolve "não" sem mostrar nada) */
function confirmar(texto,{ok='Continuar',perigo=false}={}){
  return new Promise(res=>{
    $('confModal')?.remove();
    const [tit,...resto]=String(texto).split('\n\n');
    const d=document.createElement('div'); d.id='confModal'; d.className='pc-modal';
    d.innerHTML=`<form class="pc-caixa" id="confForm" role="alertdialog" aria-modal="true" aria-labelledby="confT"><h2 id="confT" style="font-size:15.5px;white-space:pre-line">${esc(tit)}</h2>${resto.length?`<p style="white-space:pre-line">${esc(resto.join('\n\n'))}</p>`:''}
      <div class="pc-acts" style="gap:8px"><button type="button" class="btn ghost" id="confNao">Cancelar</button><button type="submit" class="btn ${perigo?'danger':'pri'}" id="confSim">${esc(ok)}</button></div></form>`;
    document.body.appendChild(d);
    const fim=v=>{d.remove(); document.removeEventListener('keydown',tec,true); res(v)};
    const tec=ev=>{if(ev.key==='Escape'){ev.stopPropagation();fim(false)}};
    document.addEventListener('keydown',tec,true);
    $('confNao').onclick=()=>fim(false); $('confForm').onsubmit=ev=>{ev.preventDefault();fim(true)};
    setTimeout(()=>$('confSim')?.focus(),30);
  });
}

const deB64=s=>{const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u};
function achaB64(p){
  if(typeof p==='string') return p.replace(/^data:[^,]+,/,'').replace(/\s+/g,'');
  if(p&&typeof p==='object'){for(const k of ['content','data','base64Content','base64','fileContent','body']) if(typeof p[k]==='string'&&p[k].length>100) return achaB64(p[k]); for(const v of Object.values(p)){const r=achaB64(v);if(r&&r.length>100)return r}}
  return '';
}
async function datasheetDoDrive(fid){
  const e=S.qdraft, box=$('dsMsg'); const st=(t,c)=>{if(box){box.textContent=t;box.className='sync-msg '+(c||'')}};
  if(!mcp){st(msgMcp({code:'not_granted'}).replace(/Google Sheets/g,'Google Drive'),'err');return}
  try{
    st('Consultando o arquivo no Google Drive…');
    const m=await mcp.callTool(GD,'get_file_metadata',{fileId:fid,excludeContentSnippets:true},{cache:false});
    const meta=m?.payload||{};
    if(meta.mimeType&&meta.mimeType!=='application/pdf'){st(`O link de referência aponta para um arquivo que não é PDF (${meta.mimeType}).`,'err');return}
    if(+meta.fileSize>15*1048576){st('O PDF tem mais de 15 MB. Baixe e anexe manualmente.','err');return}
    st(`Baixando ${meta.title||'o PDF'}…`);
    const r=await mcp.callTool(GD,'download_file_content',{fileId:fid},{cache:false});
    const b=achaB64(r?.payload??r?.content?.[0]?.text);
    if(!b) throw {code:'formato'};
    const bytes=deB64(b);
    if(!(bytes[0]===0x25&&bytes[1]===0x50&&bytes[2]===0x44&&bytes[3]===0x46)) throw {code:'formato'};
    st('Gerando as páginas do datasheet…');
    const f=new File([bytes],meta.title||'datasheet.pdf',{type:'application/pdf'});
    await gravarDatasheet(e,await datasheetDeArquivo(f,{driveId:fid,daRef:true}));
    toast('Datasheet trazido do Drive'); renderMain();
  }catch(err){st(err?.code==='formato'?'O Drive não devolveu um PDF válido para este link. Baixe e anexe manualmente.':err?.code?msgMcp(err).replace(/Google Sheets/g,'Google Drive'):'Não foi possível ler este PDF.','err')}
}

/* Descrição simplificada (texto do keynote): o item central guarda as variações (descs) e qual é a principal
   (descPri; b.desc = texto da principal). Projetos novos entram com a principal; cada linha de projeto guarda o
   próprio texto e não muda quando o central muda. O diagnóstico da planilha compara cada linha com o central. */
const nTxt=t=>String(t||'').trim().replace(/\s+/g,' ');
const descsDe=b=>b?.descs?.length?b.descs:(b?[{id:'d0',t:nTxt(b.desc)}]:[]);
const descPriId=b=>{const L=descsDe(b); return b?.descPri&&L.some(v=>v.id===b.descPri)?b.descPri:L[0]?.id};
const descPri=b=>descsDe(b).find(v=>v.id===descPriId(b));
const descVarDe=(b,t)=>descsDe(b).find(v=>nTxt(v.t)===nTxt(t));
async function descRegistrar(b,t,{principal=false}={}){
  t=nTxt(t); const L=descsDe(b).map(x=>({...x})); let v=L.find(x=>nTxt(x.t)===t);
  if(!v){v={id:'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),t,em:Date.now(),...(me?{por:me}:{})}; L.push(v)}
  const pri=principal?v.id:descPriId(b), upd={descs:L,descPri:pri,desc:L.find(x=>x.id===pri).t,atualizadoEm:Date.now()};
  await espbColl().doc(b.id).update(upd); Object.assign(b,upd); return v;
}
function descEstado(e){
  const b=espbDe(e); if(!b||projArquivado(e.projeto)) return null; const p=descPri(b), v=descVarDe(b,e.desc);
  if(v&&v.id===p?.id) return 'ok';

  return e.descEsc==='manual'||e.descOk===p?.id?'var':'mudou';

const DESC_EST={ok:['Principal','dg-ok'],var:['Variação escolhida','dg-var'],mudou:['Principal mudou','dg-mud'],fora:['Fora do central','dg-fora']};
const DESC_DICA={ok:'Usa a descrição principal do banco central.',var:'Usa outra variação cadastrada no banco central, escolhida para este projeto.',mudou:'Usava a principal, mas a principal do banco central mudou depois.',fora:'O texto não existe em nenhuma variação do banco central.'};

async function diagAcao(op,eid){
  const e=S.espec.get(eid), b=espbDe(e); if(!e||!b||S.ro) return; let upd;
  if(op==='atualizar') upd={desc:descPri(b).t,descEsc:'auto',descOk:null};
  else if(op==='registrar'){await descRegistrar(b,e.desc); upd={descEsc:'manual',descOk:null}}
  else if(op==='variacao') upd={descEsc:'manual',descOk:null};
  else return;

  try{await espColl().doc(e.id).update(upd); Object.assign(e,upd); toast('Salvo'); render()}catch{toast('Não foi possível salvar.')}

async function descAplicarLinha(body){
  // linha de projeto: texto existente vira a variação usada; texto novo é registrado como variação no central
  const b=S.espb.get(body.item); if(!b) return;
  let v=descVarDe(b,body.desc); if(!v) v=await descRegistrar(b,body.desc);

/* ---- importação da planilha de especificação (abas ET-…) ---- */
const REGRAS_ET=[[h=>/^COD/.test(h),'kn'],[h=>/^DESCRICAO/.test(h),'desc'],[h=>/^ESPECIFICACAO/.test(h),'texto'],[h=>/^FERRAGE/.test(h),'ferragens'],[h=>/^OBS/.test(h),'obs']]; // dimensões e quantidades de aplicação ficam fora
function tabelaDeAba(aba){
  const t=semAc(String(aba||'').replace(/^ET\s*-\s*/i,'').replace(/-?R\d+\s*$/i,'').replace(/^TABELA DE\s+/i,'')).toUpperCase().trim();
  const m={'TABELA DE MATERIAIS':'Materiais','MATERIAIS':'Materiais','CHAPIM':'Chapim','CORRIMAO E GUARDA CORPO':'Corrimão e guarda-corpo','DIVISORIAS':'Divisórias','DRYWALL':'Drywall','ESQUADRIAS':'Esquadrias','GRADIS':'Gradis','JANELAS':'Janelas','LOUCAS E METAIS':'Louças e metais','MARCENARIAS':'Marcenarias','PORTAS':'Portas','MOBILIARIOS':'Mobiliário','MOBILIARIO':'Mobiliário','RODAPES':'Rodapés','EQUIPAMENTOS':'Equipamentos'};
  return m[t]||(t?t.charAt(0)+t.slice(1).toLowerCase():'Diversos');
}
const DIM_ET=['largura','altura','peitoril','qtd','comp','area'];
const varDe=e=>({kn:e.kn,linha:e.linha||''});
const fmtBr=n=>(Math.round(n*100)/100).toLocaleString('pt-BR',{maximumFractionDigits:2});
function agregarVar(a){
  for(const k of DIM_ET){const vs=a.var.map(v=>v[k]).filter(Boolean);
    if(['qtd','comp','area'].includes(k)) a[k]=vs.length?fmtBr(vs.reduce((s,v)=>s+(numBr(v)||0),0)):'';
    else a[k]=vs.length&&vs.every(v=>v===vs[0])&&vs.length===a.var.length?vs[0]:(vs.length?'variável':'')}
}
function lerAbaEt(values,aba){
  let hi=-1,cols=null;
  for(let i=0;i<Math.min(values.length,30);i++){const n=(values[i]||[]).map(normH); if(n.some(h=>/^COD/.test(h))&&n.some(h=>/^ESPECIFICACAO|^DESCRICAO/.test(h))){hi=i;cols=n;break}}
  if(hi<0) return [];
  const map={}; cols.forEach((h,j)=>{if(!h)return; for(const [t,k] of REGRAS_ET) if(t(h)&&!(k in map)){map[k]=j;break}});
  const tabela=tabelaDeAba(aba), por=new Map();
  for(let i=hi+1;i<values.length;i++){
    const r=(values[i]||[]).map(v=>String(v??'').trim()), g=k=>k in map?r[map[k]]||'':'';
    let kn=g('kn'); if(!kn) continue;
    const e={tabela,linha:i+1}; for(const k of Object.keys(map)) e[k]=g(k);
    const ls=kn.split(/\n+/).map(s=>s.trim()).filter(Boolean); kn=ls[0].toUpperCase(); e.kn=kn; if(ls.length>1) e.obs=[e.obs,ls.slice(1).join(' ')].filter(Boolean).join(' · ');
    if(/^CANCELAD/i.test(e.desc||'')){e.obs=[e.obs,'CANCELADO'].filter(Boolean).join(' · ');e.desc=''}
    if(!e.texto&&!e.desc) continue;
    if(!e.desc) e.desc=descCurta(e.texto);
    // mesma descrição/especificação, mudando só dimensões ou quantidades de aplicação: um item só, com as variações
    const k=normTxtEt([e.desc,e.texto,e.ferragens,/CANCELAD/i.test(e.obs||'')?'x':''].join('|')), kk=knChave(kn);
    let a=por.get(k)||[...por.values()].find(x=>x.var?x.var.some(v=>knChave(v.kn)===kk):knChave(x.kn)===kk);
    if(!a){por.set(k,e);continue}
    if(!a.var) a.var=[varDe(a)];
    a.var.push(varDe(e));
  }
  return [...por.values()];
}
async function importarEt(pid){
  if(S.ro) return; if(!mcp){toast(msgMcp({code:'not_granted'}));return}
  const link=await pedirNome({titulo:'Importar planilha de especificação técnica',rotulo:'Link da planilha no Google Sheets',padrao:'',ok:'Ler planilha',bruto:true}); if(!link) return;
  const id=idPlanilha(link); if(!id){toast('Cole o link de uma planilha do Google Sheets');return}
  toast('Lendo as abas da planilha…');
  let abas=[]; try{const g=await mcp.callTool(GS,'get_spreadsheet',{spreadsheetId:id,fields:['sheets.properties.title']},{cache:false}); abas=(g?.payload?.sheets||[]).map(s=>s.properties?.title).filter(Boolean)}catch(e){toast(msgMcp(e));return}
  abas=abas.filter(a=>/^ET\s*-/i.test(a)&&!/AMBIENTE/i.test(a)); if(!abas.length){toast('Não encontrei abas “ET-…” nessa planilha');return}

  // renumera no padrão do escritório: sigla nova (tabela de siglas) + número sequencial na ordem da planilha
  const ordO=(a,b)=>knPref(a.kn).localeCompare(knPref(b.kn))||knNum(a.kn)-knNum(b.kn)||String(a.kn).localeCompare(String(b.kn),'pt',{numeric:true});
  const cont=new Map();

    e.tipo=e.tabela==='Materiais'?'material':(siglaEt(siglaNova(knPref(e.kn),e.tabela,'elemento'))?.tipo||'elemento');

  if(!await confirmar(`Importar ${linhas.length} itens de ${abas.length} abas?\n\n${porTab}\n\nOs keynotes são renumerados no padrão do escritório (material PI.01, composição DRY.01, elemento/família PMD.01), conforme a tabela de siglas da Biblioteca; o código original fica guardado como código de origem. Itens iguais que só mudam de dimensão viram um só. Cada keynote ganha um item novo no banco central (FJ.SIGLA.NNNN).${antigos.length?`\n\nEste projeto já tem ${antigos.length} itens importados desta planilha: eles serão substituídos (os itens centrais que só eles usavam também saem).`:''}`,{ok:antigos.length?'Substituir e importar':'Importar'})) return;
  let feitos=0, falhas=0;

    for(const x of antigos){try{await espColl().doc(x.id).delete(); S.espec.delete(x.id); const c=S.espb.get(x.item); if(c&&c.origem?.projeto===pid&&!usosEspb(c.id).length){await espbColl().doc(c.id).delete(); S.espb.delete(c.id)}}catch(err){if(err?.code==='invalid_argument'){toast('Você não tem permissão para editar');return}}}}
  toast(`Importando ${linhas.length} itens…`);
  const campos=['tabela','desc','texto','ferragens','obs','var','knOrig'];
  for(const e of linhas){

      const b=await novoEsCentral({sigla:e.sigla,tipo:e.tipo,desc:e.desc,texto:e.texto,origem:{projeto:pid,kn:e.knOrig}});

    }catch(err){falhas++; if(err?.code==='invalid_argument'){toast('Você não tem permissão para editar');break}}

async function salvarItem(){
  const d=S.draft; if(!d) return true;
  const body={...d}; delete body.id;
  body.nome=(body.nome||'').trim()||'Sem nome'; body.pasta=(body.pasta||'').trim();
  if(body.ajustes) for(const k of Object.keys(body.ajustes)) if(!String(body.ajustes[k]).trim()) delete body.ajustes[k];
  if(body.secao==='parceiros'&&discsParc(body)[0]) body.pasta=discNome(discsParc(body)[0]);
  if(body.secao==='disciplinas'&&body.campos?.codigo) body.campos={...body.campos,codigo:String(body.campos.codigo).trim().toUpperCase()};
  const atual=S.itens.get(d.id); if(atual){if(atual.disciplinas) body.disciplinas=atual.disciplinas; body.arquivos=atual.arquivos||[]; if(atual.pastasArq) body.pastasArq=atual.pastasArq; if(body.padronizacao||atual.padronizacao) body.padronizacao={...(body.padronizacao||{}),peb:atual.padronizacao?.peb??null}}
  body.atualizadoEm=Date.now(); if(me) body.atualizadoPor=me;
  try{await coll().doc(d.id).set(body);S.dirty=false;S.draft={...body,id:d.id};toast('Salvo');return true}
  catch(e){toast(e?.code==='invalid_argument'?'Você não tem permissão para editar o sistema':'Não foi possível salvar. Tente de novo.');if(e?.code==='invalid_argument'){S.ro=true;render()}return false}
}
async function salvarSchema(){
  const sd=S.schemaDraft; if(!sd) return true;
  for(const f of sd.fields){f.label=(f.label||'').trim()||'Campo sem nome'; if(f.type==='select'&&!Array.isArray(f.options)) f.options=[]; if(f.type!=='select') delete f.options}
  const novo={...S.schema,[sd.sec]:sd.fields};
  try{await db.doc('config/schema').set({secoes:novo,atualizadoEm:Date.now()});S.schema=novo;S.dirty=false;toast('Campos salvos');return true}
  catch(e){toast('Não foi possível salvar os campos.');return false}
}
async function novoItem(sec){
  if(S.dirty){toast('Salve ou descarte as alterações antes');return}
  let pasta='';
  if(S.view.t==='item'){const c=S.itens.get(S.view.id); if(c&&c.secao===sec) pasta=c.pasta||''}
  const ref=coll().doc();
  const body={secao:sec,nome:'Novo '+SEC[sec].um,pasta,status:STATUS[sec][0],campos:{},criadoEm:Date.now(),atualizadoEm:Date.now()};
  if(me){body.atualizadoPor=me;body.criadoPor=me}
  if(sec==='projetos'){body.familias=[];body.ajustes={};body.pasta=pasta||String(new Date().getFullYear())}
  try{
    await ref.set(body);

    S.abertas.add('s:'+sec);if(SEC[sec].pai)S.abertas.add('g:'+SEC[sec].pai);S.abertas.add('p:'+sec+':'+(body.pasta||'Sem pasta'));

async function croGravarLote(lista){

  const falhas=r.map((x,i)=>x.status==='rejected'?lista[i][0]:null).filter(Boolean);

var DESF={pilha:[],refazer:[],grupo:null,t:0,rodando:false}; const SOMBRA={};
const MAPA_COLL={sugest:()=>S.sugest,itens:()=>S.itens,coment:()=>S.coment,pend:()=>S.pends,rdoc:()=>S.rdocs,ata:()=>S.atas,croq:()=>S.croqs,equip:()=>S.equip,crono:()=>S.crono,espec:()=>S.espec,espb:()=>S.espb,etsig:()=>S.etsig};
function sombraDe(n){return SOMBRA[n]||(SOMBRA[n]=new Map())}
// campos de controle (vínculos e espelhos de planilhas) não entram no desfazer
const SEM_DESF=new Set(['comEspelhoDev','pdEspelhoDev','equipEspelhoDev','comEspelhoOff','pdEspelhoOff','equipEspelhoOff','croEspelho','comEspelho','pdEspelho','rdEspelho','rdEspelhoDev','rdEspelhoOff','rdOrigem','rdExport','ataPasta','croqPasta','comOrigem','pdOrigem','equipOrigem','comExport','pdExport','equipExport']);
function registrarDesf(coll,id,antes){
  if(DESF.rodando||!id) return;
  if(!DESF.grupo){DESF.grupo={t:Date.now(),itens:[]}; }
  const g=DESF.grupo; if(!g.itens.some(x=>x.coll===coll&&x.id===id)) g.itens.push({coll,id,antes});
  clearTimeout(DESF.t); DESF.t=setTimeout(fecharGrupoDesf,450);
}
function fecharGrupoDesf(){
  const g=DESF.grupo; DESF.grupo=null; if(!g||!g.itens.length) return;
  if(g.itens.length>150){toast('Alteração grande demais para desfazer (importação).');return}
  DESF.pilha.push(g); if(DESF.pilha.length>20) DESF.pilha.shift(); DESF.refazer=[];
  botaoDesf();
}
function botaoDesf(){
  const t=$('toast'); if(!t) return;
  if(t.hidden||!t.textContent.trim()){t.innerHTML='<span>Alteração salva</span>';t.hidden=false}
  if(!t.querySelector('.toast-desf')) t.insertAdjacentHTML('beforeend',`<button class="toast-desf" data-act="desfazer" title="Desfazer (Ctrl+Z)">Desfazer</button>`);
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,6000);
}
async function aplicarGrupoDesf(g){
  const conflito=g.itens.filter(x=>{const a=sombraDe(x.coll).get(x.id);return a&&a.atualizadoPor&&me&&a.atualizadoPor!==me&&(a.atualizadoEm||0)>g.t});
  if(conflito.length) return {erro:`${conflito.length>1?'itens foram alterados':'o item foi alterado'} por outra pessoa depois`};
  const inv={t:Date.now(),itens:[]}; let falhou=0;
  DESF.rodando=true;
  try{
    for(const x of [...g.itens].reverse()){
      const ref=db.collection(x.coll).doc(x.id), mp=MAPA_COLL[x.coll]?.(), sm=sombraDe(x.coll);
      const agora=sm.has(x.id)?structuredClone(sm.get(x.id)):null;
      try{
        if(x.antes){await ref.set(structuredClone(x.antes)); sm.set(x.id,structuredClone(x.antes)); if(mp) mp.set(x.id,{...structuredClone(x.antes),id:x.id})}
        else {await ref.delete(); sm.delete(x.id); if(mp) mp.delete(x.id)}
        inv.itens.unshift({coll:x.coll,id:x.id,antes:agora});
        if(!S.dirty){const n=mp?.get(x.id); if(S.qdraft?.id===x.id) S.qdraft=n?structuredClone(n):null; if(S.draft?.id===x.id&&n) S.draft=structuredClone(n)}
        if(CRO.dr?.id===x.id){CRO.dr=null;croDrawer()}
      }catch{falhou++}
    }
  } finally {DESF.rodando=false}
  render();
  return {inv,falhou};
}
function avisoDesf(msg,acao,rot){
  const t=$('toast'); if(!t) return; t.innerHTML=`<span>${esc(msg)}</span>${acao?`<button class="toast-desf" data-act="${acao}">${rot}</button>`:''}`; t.hidden=false;
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,5000);
}
async function desfazer(){
  if(DESF.grupo){clearTimeout(DESF.t);fecharGrupoDesf()}
  if(S.ro) return; const g=DESF.pilha.pop(); if(!g){avisoDesf('Nada para desfazer',DESF.refazer.length?'refazer':'', 'Refazer');return}
  const r=await aplicarGrupoDesf(g);
  if(r.erro){avisoDesf('Não foi desfeito: '+r.erro+'.');return}
  if(r.inv.itens.length) DESF.refazer.push(r.inv);
  avisoDesf(r.falhou?`Desfeito em parte (${r.falhou} falha${r.falhou>1?'s':''})`:'Alteração desfeita','refazer','Refazer');
}
async function refazer(){
  if(S.ro) return; const g=DESF.refazer.pop(); if(!g){avisoDesf('Nada para refazer');return}
  const r=await aplicarGrupoDesf(g);
  if(r.erro){avisoDesf('Não foi refeito: '+r.erro+'.');return}
  if(r.inv.itens.length){DESF.pilha.push(r.inv); if(DESF.pilha.length>20) DESF.pilha.shift()}
  avisoDesf(r.falhou?`Refeito em parte (${r.falhou} falha${r.falhou>1?'s':''})`:'Alteração refeita','desfazer','Desfazer');
}
function envolverDb(base){
  if(!base||base.__desf) return base;
  // proxies sobre objetos vazios: não dependem de o objeto original ser extensível/congelado
  const repassa=(alvo,k)=>{const v=alvo[k]; return typeof v==='function'?v.bind(alvo):v};
  const doc=(n,d)=>new Proxy({},{get(_,k){
    if(k==='set'||k==='update'||k==='delete') return async(...a)=>{
      const id=d.id, sm=sombraDe(n), existia=!!(id&&sm.has(id)), antes=existia?structuredClone(sm.get(id)):null;
      const r=await d[k](...a);
      try{const mo=n==='coment'?'cm':n==='pend'?'pd':n==='rdoc'?'rd':n==='equip'?'eq':n==='crono'?'cr':null; if(mo&&id){const pj=a[0]?.projeto||antes?.projeto||sm.get(id)?.projeto||(mo==='cr'?S.crono.get(id):MODS[mo]?.mapa().get(id))?.projeto; if(pj) espAgendar(mo,pj)}
        if(n==='itens'&&id){const sc=a[0]?.secao||antes?.secao||sm.get(id)?.secao||S.itens.get(id)?.secao; if(ESP[sc]?.sec) espAgendar(sc,sc)}}catch(e){console.warn('espelho',e)}
      try{ if(id){
        if(k==='delete') sm.delete(id); else if(k==='set') sm.set(id,structuredClone(a[0]||{})); else sm.set(id,{...(sm.get(id)||{}),...structuredClone(a[0]||{})});
        const soMeta=k==='update'&&a[0]&&Object.keys(a[0]).every(x=>SEM_DESF.has(x));
        if(!(k==='update'&&!existia)&&!soMeta) registrarDesf(n,id,antes)} }catch(e){console.warn('desfazer',e)}
      return r};
    return repassa(d,k)},has(_,k){return k in d}});
  const col=(n,c)=>new Proxy({},{get(_,k){
    if(k==='doc') return(...a)=>doc(n,c.doc(...a));
    if(k==='onSnapshot') return(cb,...r)=>c.onSnapshot(snap=>{try{const m=sombraDe(n); m.clear(); for(const d of snap.docs) m.set(d.id,structuredClone(d.data()))}catch(e){console.warn('sombra',e)} return cb(snap)},...r);
    return repassa(c,k)},has(_,k){return k in c}});
  return new Proxy({},{get(_,k){if(k==='__desf') return true; if(k==='collection') return n=>col(n,base.collection(n)); return repassa(base,k)},has(_,k){return k==='__desf'||k in base}});
}
document.addEventListener('keydown',ev=>{

  if(S.ro) return; ev.preventDefault(); refaz?refazer():desfazer();
});

let PC_ESC=null;

function pcTratarTexto(t){
  t=String(t||'').trim();
  if(t.startsWith('fja-escolhido:')){let r=null; try{r=JSON.parse(t.slice(14))}catch{} pcModalFechar(r&&!r.cancelado&&!r.erro?r:null); if(r?.cancelado) toast('Seleção cancelada'); else if(r?.erro) toast('Erro no computador: '+r.erro); return true}
  const st=$('pcModalMsg');

  return false;

async function escolherNoPC({tipo='qualquer',inicio='',titulo='Escolha o arquivo'}={}){
  if(PC_ESC) pcModalFechar(null);
  try{await navigator.clipboard.writeText('fja-escolher:'+JSON.stringify({tipo,inicio,titulo}))}catch{toast('Não foi possível falar com o computador (área de transferência bloqueada).');return null}
  return new Promise(ok=>{
    const paste=ev=>{const t=ev.clipboardData?.getData('text')||''; if(pcTratarTexto(t)){ev.preventDefault();ev.stopPropagation()}};
    const foco=()=>{setTimeout(async()=>{try{const t=await navigator.clipboard.readText(); pcTratarTexto(t)}catch{}},150)};
    PC_ESC={ok,paste,foco};
    document.addEventListener('paste',paste,true); window.addEventListener('focus',foco);
    const d=document.createElement('div'); d.id='pcModal'; d.className='pc-modal';
    d.innerHTML=`<div class="pc-caixa" role="dialog" aria-modal="true" aria-labelledby="pcModalT"><h2 id="pcModalT">Escolha no Windows</h2>

      <p>${esc(titulo)}${tipo==='qualquer'?' — para escolher uma <b>pasta</b>, entre nela e clique em <i>Abrir</i> com o nome “Selecionar esta pasta”':''}. O caminho é atualizado sozinho quando você clicar em <i>Abrir</i>.</p>

/* acha no Drive o id do arquivo/pasta escolhido no G:, comparando o caminho completo */
async function idPorCaminho(cam,pasta){
  const nome=cam.split('\\').pop(), titulo=nome.replace(/\.(gsheet|gdoc|gslides|gdraw|gform)$/i,''), norm=x=>String(x||'').toLowerCase().replace(/[\\/]+$/,'');
  const q=`title = '${titulo.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}' and trashed = false`+(pasta?` and mimeType = '${PASTA_MIME}'`:'');
  const r=await mcp.callTool(GD,'search_files',{query:q,pageSize:20,excludeContentSnippets:true},{cache:false});
  const fs=(r?.payload?.files||[]).filter(f=>!f.trashed);
  for(const f of fs){try{const c=await caminhoWin(f); if(norm(pasta?c.pasta:c.arquivo)===norm(cam)) return f}catch{}}
  return fs.length===1?fs[0]:null;
}
/* caminho do G: → id no Drive, descendo pasta a pasta a partir da raiz (Meu Drive ou drive compartilhado conhecido) */
async function idPorDescida(cam,pasta){
  const partes=cam.replace(/[\\/]+$/,'').split('\\').filter(Boolean); if(!/^[A-Za-z]:$/.test(partes[0]||'')) return null;
  let pai=null, i=1;
  if(partes[1]==='Meu Drive'){pai='root'; i=2}
  else if(partes[1]==='Drives compartilhados'){const nm=Object.keys(DRIVES_RAIZ).find(n=>n.toLowerCase()===String(partes[2]||'').toLowerCase()); if(!nm) return null; pai=DRIVES_RAIZ[nm]; i=3}
  else return null;
  if(i>=partes.length) return {id:pai,mimeType:PASTA_MIME};
  let f=null;
  for(;i<partes.length;i++){
    const ult=i===partes.length-1, nome=ult?partes[i].replace(/\.(gsheet|gdoc|gslides|gdraw|gform)$/i,''):partes[i];
    const q=`parentId = '${pai}' and title = '${nome.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}' and trashed = false`+(!ult||pasta?` and mimeType = '${PASTA_MIME}'`:'');
    const r=await mcp.callTool(GD,'search_files',{query:q,pageSize:10,excludeContentSnippets:true},{cache:false});
    const fs=(r?.payload?.files||[]).filter(x=>!x.trashed); if(!fs.length) return null;
    f=fs[0]; pai=f.id;
  }
  return f;
}
async function pcResolver(res){
  if(!res) return null;
  if(res.id) return {id:res.id,url:res.url||'',caminho:res.caminho,pasta:!!res.pasta};
  if(!mcp){toast('Sem conexão com o Google Drive para localizar o arquivo.');return null}
  toast('Localizando no Google Drive…');
  for(const metodo of [idPorDescida,idPorCaminho]){
    try{const f=await metodo(res.caminho,res.pasta); if(f?.id) return {id:f.id,url:f.viewUrl||'',caminho:res.caminho,pasta:!!res.pasta,mime:f.mimeType}}catch(e){console.warn('localizar',e)}
  }
  toast('Não encontrei no Google Drive: '+res.caminho); return null;
}

  const aba=[o.aba,md.abaEx].find(a=>a&&abas.includes(a));
  if(aba){
    const novo={...o,planilha:res.id,aba,caminho:{pasta:res.caminho.replace(/\\[^\\]*$/,''),arquivo:res.caminho}}; if(novo.planilha!==o.planilha){delete novo.sincronizadoEm;delete novo.linhas}
    try{await coll().doc(pid).update({[md.origKey]:novo}); it[md.origKey]=novo; renderMain(); toast(`Planilha de origem atualizada (aba ${aba})`)}catch{toast('Não foi possível vincular.')}
    return;
  }
  S.syncEdit=true; S.syncAbas=null; renderMain();
  const u=$('syncUrl'); if(u) u.value=`https://docs.google.com/spreadsheets/d/${res.id}/edit`;
  await carregarAbas(); toast('A planilha escolhida não tem a aba '+(o.aba||md.abaEx)+': escolha a aba e clique em Vincular');
  $('syncUrl')?.closest('section')?.scrollIntoView({block:'center',behavior:'smooth'});

   cabeçalho na linha 5, que o importador reconhece) e passa a usá-la como origem. A origem anterior fica intacta no Drive. */
async function pcNovaOrigem(mod,pid){
  const md=MODS[mod], it=S.itens.get(pid), o=it?.[md.origKey]||{}; if(!it||S.ro) return;
  if(!mcp){toast('Sem conexão com o Google Drive.');return}
  const res=await pcResolver(await escolherNoPC({tipo:'pasta',inicio:o.caminho?.pasta||it.comOrigem?.caminho?.pasta||'G:\\',titulo:'Escolha a pasta onde será criada a nova planilha de origem'}));
  if(!res) return;
  if(!res.pasta){toast('Escolha uma pasta.');return}
  if(o.planilha&&!await confirmar(`Criar uma nova planilha de origem em\n${res.caminho}?\n\nA planilha atual continua no Drive, mas deixa de ser a origem deste projeto.`)) return;
  const titulo=await pedirNome({titulo:'Criar nova planilha de origem',padrao:md.xNome(it).replace(/-\d{4}-\d{2}-\d{2}$/,''),pasta:res.caminho}); if(!titulo) return;
  toast('Criando a nova planilha de origem…');
  try{
    const {buf}=await montarXlsx(pid,md);
    const r=await mcp.callTool(GD,'create_file',{title:titulo,contentMimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',base64Content:b64(buf),parentId:res.id},{cache:false});
    const f=r?.payload||{}, id=f.id||f.file?.id; if(!id) throw {message:'O Drive não devolveu o arquivo criado.'};
    let aba=md.xAba; try{const g=await mcp.callTool(GS,'get_spreadsheet',{spreadsheetId:id,fields:['sheets.properties.title']},{cache:false}); aba=g?.payload?.sheets?.[0]?.properties?.title||aba}catch{}
    const novo={planilha:id,aba,caminho:{pasta:res.caminho,arquivo:res.caminho.replace(/\\$/,'')+'\\'+(f.title||titulo)+'.gsheet'},criadaPeloSistema:Date.now(),linhas:md.de(pid).length,...(me?{criadaPor:me}:{})};
    await coll().doc(pid).update({[md.origKey]:novo}); it[md.origKey]=novo; renderMain();
    toast('Nova planilha de origem criada e vinculada');
  }catch(e){toast(e?.code?msgMcp(e).replace(/Google Sheets/g,'Google Drive'):(e?.message||'Não foi possível criar a planilha.'))}
}
async function pcLocalCm(eid){

  const res=await pcResolver(await escolherNoPC({tipo:'qualquer',inicio:caminhoCm(e)?.pasta||'',titulo:'Escolha o arquivo (ou a pasta) do comentário'}));
  if(!res||S.qdraft?.id!==eid) return;
  const m=/\.(gsheet|gdoc|gslides)$/i.exec(res.caminho)?.[1]?.toLowerCase();
  const url=res.pasta?`https://drive.google.com/drive/folders/${res.id}`:m==='gsheet'?`https://docs.google.com/spreadsheets/d/${res.id}/edit`:m==='gdoc'?`https://docs.google.com/document/d/${res.id}/edit`:m==='gslides'?`https://docs.google.com/presentation/d/${res.id}/edit`:(res.url||`https://drive.google.com/file/d/${res.id}/view`);
  const sujo=S.dirty; S.qdraft.local=url; marcaSujo();

const crlf=s=>s.replace(/\r?\n/g,'\r\n');
const PC_FUNC=`function Abrir-FJA([string]$p) {
  $p = $p.Trim().Trim('"') -replace '/', '\\'
  # so aceita caminhos dentro do G: e sem subir pastas
  if ($p -notmatch '^[Gg]:\\\\' -or $p -match '\\.\\.') { return }
  $alvo = $p
  while ($alvo -and -not (Test-Path -LiteralPath $alvo)) { $alvo = Split-Path -Parent $alvo }
  if (-not $alvo) { return }
  $pastaAlvo = $alvo
  if (Test-Path -LiteralPath $alvo -PathType Leaf) {
    $pastaAlvo = Split-Path -Parent $alvo
    Start-Process explorer.exe -ArgumentList ('/select,"' + $alvo + '"')
  } else {
    Start-Process explorer.exe -ArgumentList ('"' + $alvo + '"')
  }
  # traz a janela do Explorer para a frente (o Windows abre em segundo plano quando o pedido vem de um processo oculto)
  try {
    $sh = New-Object -ComObject Shell.Application
    for ($i = 0; $i -lt 25; $i++) {
      Start-Sleep -Milliseconds 150
      foreach ($w in @($sh.Windows())) {
        try { $p2 = $w.Document.Folder.Self.Path } catch { $p2 = $null }
        if ($p2 -and ($p2.TrimEnd([char]92) -ieq $pastaAlvo.TrimEnd([char]92))) { Trazer-Frente ([IntPtr]$w.HWND); return }
      }
    }
  } catch {}
}
function Trazer-Frente([IntPtr]$h) {
  try {
    if ($h -eq [IntPtr]::Zero) { return }
    # liga temporariamente a entrada ao programa que está na frente (navegador) para poder passar o foco
    $fg = [FJA.Clip]::GetForegroundWindow(); $pidFg = [uint32]0
    $t1 = [FJA.Clip]::GetWindowThreadProcessId($fg, [ref]$pidFg); $t2 = [FJA.Clip]::GetCurrentThreadId()
    $ligou = $false; if ($t1 -ne 0 -and $t1 -ne $t2) { $ligou = [FJA.Clip]::AttachThreadInput($t2, $t1, $true) }
    [void][FJA.Clip]::ShowWindow($h, 9)
    [void][FJA.Clip]::BringWindowToTop($h)
    [void][FJA.Clip]::SetForegroundWindow($h)
    if ($ligou) { [void][FJA.Clip]::AttachThreadInput($t2, $t1, $false) }
  } catch {}
}
`;

tooltip:
  pt_br: "Cria/atualiza a vista 'AUT - LEGENDA DE PONTOS DE AUTOMA\u00c7\u00c3O' com todas as fam\u00edlias '(AUT)' que aparecem nas vistas das pranchas (um item por tipo), na cor em que aparecem no projeto. Elementos desenhados \u00e0 m\u00e3o na vista s\u00e3o preservados."
  en_us: "Cria/atualiza a vista 'AUT - LEGENDA DE PONTOS DE AUTOMA\u00c7\u00c3O' com todas as fam\u00edlias '(AUT)' que aparecem nas vistas das pranchas (um item por tipo), na cor em que aparecem no projeto. Elementos desenhados \u00e0 m\u00e3o na vista s\u00e3o preservados."

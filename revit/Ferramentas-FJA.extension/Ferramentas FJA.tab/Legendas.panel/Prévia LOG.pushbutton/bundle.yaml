title:
  pt_br: "Legendas"
  en_us: "Legendas"
tooltip:
  pt_br: "Ferramenta de legendas por disciplina (LOG, AUT, SON): escolha a disciplina, veja as legendas criadas ou crie uma nova; ajuste itens, textos, ordem (arrastando), escala dos símbolos, linhas, largura e cor, e veja a prévia antes de gravar."
  en_us: "Ferramenta de legendas por disciplina (LOG, AUT, SON): escolha a disciplina, veja as legendas criadas ou crie uma nova; ajuste itens, textos, ordem (arrastando), escala dos símbolos, linhas, largura e cor, e veja a prévia antes de gravar."

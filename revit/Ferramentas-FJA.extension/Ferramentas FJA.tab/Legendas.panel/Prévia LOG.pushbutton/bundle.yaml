tooltip:
  pt_br: "Abre a legenda de pontos de lógica numa janela com prévia (C#). Escolha os itens e os textos, a ordem (arrastando), o tamanho dos símbolos, as linhas, a largura e a cor; acrescente símbolos e detail items. Veja o resultado antes de gravar; Cancelar desfaz tudo."
  en_us: "Abre a legenda de pontos de lógica numa janela com prévia (C#). Escolha os itens e os textos, a ordem (arrastando), o tamanho dos símbolos, as linhas, a largura e a cor; acrescente símbolos e detail items. Veja o resultado antes de gravar; Cancelar desfaz tudo."

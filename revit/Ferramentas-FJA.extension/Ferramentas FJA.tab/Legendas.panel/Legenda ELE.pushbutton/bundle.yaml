tooltip:
  pt_br: "Cria/atualiza a vista 'ELE - LEGENDA DE PONTOS EL\u00c9TRICOS' com os pontos de parede de el\u00e9trica (um item por tipo e altura), os quadros el\u00e9tricos e os s\u00edmbolos de eletroduto e eletrocalha. Elementos desenhados \u00e0 m\u00e3o na vista s\u00e3o preservados."
  en_us: "Cria/atualiza a vista 'ELE - LEGENDA DE PONTOS EL\u00c9TRICOS' com os pontos de parede de el\u00e9trica (um item por tipo e altura), os quadros el\u00e9tricos e os s\u00edmbolos de eletroduto e eletrocalha. Elementos desenhados \u00e0 m\u00e3o na vista s\u00e3o preservados."

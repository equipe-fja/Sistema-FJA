title:
  pt_br: "Trocar lado"
  en_us: "Trocar lado"
tooltip:
  pt_br: "Nos eixos e níveis selecionados (ou escolhidos em seguida), desliga a indicação do lado em que está e liga do lado oposto, só na vista ativa. As pontas passam para 2D antes, para a troca não mudar as outras vistas. Eixos e níveis com indicação dos dois lados, ou sem nenhuma, ficam como estão."
  en_us: "Nos eixos e níveis selecionados (ou escolhidos em seguida), desliga a indicação do lado em que está e liga do lado oposto, só na vista ativa. As pontas passam para 2D antes, para a troca não mudar as outras vistas. Eixos e níveis com indicação dos dois lados, ou sem nenhuma, ficam como estão."

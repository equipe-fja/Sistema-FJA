<!-- Inserido por scripts/gerar.sh só na versão Firebase (dist/firebase/index.html), antes do script principal.
     Faz o papel do runtime do claude.ai: window.claude.use('db'|'user'|'downloads'|...) sobre o Firebase. -->
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-firestore-compat.js"></script>
<style>
#fbLogin{position:fixed;inset:0;z-index:99999;background:#F6F6F5;display:flex;align-items:center;justify-content:center;font-family:"Segoe UI",system-ui,sans-serif;color:#1D1D1D}
#fbLogin .cx{background:#fff;border:1px solid #E2E2DF;padding:28px 30px;width:min(420px,calc(100vw - 32px));box-sizing:border-box}
#fbLogin .lg{width:38px;height:38px;border:1px solid #C9C9C5;display:flex;align-items:center;justify-content:center;font:700 16px Arial;color:#8E1B1B;margin-bottom:14px}
#fbLogin h1{font-size:19px;font-weight:600;margin:0 0 4px}
#fbLogin p{font-size:13px;color:#5E5E5C;margin:0 0 14px;line-height:1.45}
#fbLogin input{width:100%;box-sizing:border-box;font:inherit;font-size:14px;padding:9px 10px;border:1px solid #C9C9C5;margin-bottom:10px}
#fbLogin button{font:inherit;font-size:14px;padding:9px 16px;border:0;background:#8E1B1B;color:#fff;cursor:pointer}
#fbLogin button:disabled{opacity:.5;cursor:default}
#fbLogin .msg{margin-top:12px;font-size:13px;min-height:1em}
#fbLogin .err{color:#B3261E}
#fbLogin .lk{background:none;color:#8E1B1B;padding:9px 0 0;font-size:13px;text-decoration:underline;display:block}
#fbLogin .ok{color:#2E6B2E}
</style>
<script>
(function(){
  const CFG=/*FB_CFG*/null;
  const LS='fja.fbEmail';
  firebase.initializeApp(CFG);
  const auth=firebase.auth(), fs=firebase.firestore();
  let pronto; const logado=new Promise(r=>pronto=r);
  let perfil=null;   // acessos/<uid>: {email, nome, nivel:'admin'|'usuario', trocarSenha}
  const lsGet=()=>{try{return localStorage.getItem(LS)||''}catch{return ''}}, lsSet=v=>{try{localStorage.setItem(LS,v)}catch{}};
  const ERROS={'auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/user-not-found':'E-mail ou senha incorretos.',
    'auth/invalid-email':'E-mail inválido.','auth/too-many-requests':'Muitas tentativas. Aguarde alguns minutos ou use "Esqueci a senha".',
    'auth/weak-password':'Senha fraca: use pelo menos 8 caracteres.','auth/email-already-in-use':'Já existe uma conta com este e-mail.','auth/requires-recent-login':'Por segurança, saia e entre de novo antes de trocar a senha.'};
  const msgErro=x=>ERROS[x?.code]||(x?.message||String(x));

  function tela(html){
    let d=document.getElementById('fbLogin');
    if(!d){d=document.createElement('div');d.id='fbLogin';(document.body||document.documentElement).appendChild(d)}
    d.innerHTML='<div class="cx"><div class="lg">FJ</div>'+html+'</div>'; return d;
  }
  function entrar(msg,erro){
    const d=tela('<h1>Sistema FJA</h1><p>Entre com o seu e-mail e senha.</p>'+
      '<input id="fbEm" type="email" autocomplete="username" placeholder="e-mail"><input id="fbSn" type="password" autocomplete="current-password" placeholder="senha">'+
      '<button id="fbBt">Entrar</button><button class="lk" id="fbEsq">Esqueci a senha</button>'+
      '<div class="msg'+(erro?' err':'')+'" id="fbMsg">'+(msg||'')+'</div>');
    const em=d.querySelector('#fbEm'), sn=d.querySelector('#fbSn'), bt=d.querySelector('#fbBt'), m=d.querySelector('#fbMsg');
    em.value=lsGet();
    const ir=async()=>{
      const e=em.value.trim().toLowerCase(); if(!e||!sn.value){m.className='msg err';m.textContent='Preencha e-mail e senha.';return}
      bt.disabled=true; m.className='msg'; m.textContent='Entrando…';
      try{await auth.signInWithEmailAndPassword(e,sn.value); lsSet(e)}catch(x){m.className='msg err';m.textContent=msgErro(x);bt.disabled=false}
    };
    bt.onclick=ir; sn.onkeydown=em.onkeydown=ev=>{if(ev.key==='Enter')ir()};
    d.querySelector('#fbEsq').onclick=async()=>{
      const e=em.value.trim().toLowerCase(); if(!e){m.className='msg err';m.textContent='Digite o seu e-mail acima e clique de novo em "Esqueci a senha".';return}
      try{await auth.sendPasswordResetEmail(e); m.className='msg ok'; m.textContent='Se houver uma conta para '+e+', chegou um e-mail com o link para criar uma nova senha.'}
      catch(x){m.className='msg err';m.textContent=msgErro(x)}
    };
    setTimeout(()=>(em.value?sn:em).focus(),30);
  }
  function definirSenha(u,obrigatorio){
    return new Promise(ok=>{
      const d=tela('<h1>'+(obrigatorio?'Crie a sua senha':'Alterar senha')+'</h1><p>'+(obrigatorio?'Você entrou com uma senha provisória. Escolha uma senha sua (mínimo 8 caracteres).':'Mínimo 8 caracteres.')+'</p>'+
        '<input id="fbN1" type="password" autocomplete="new-password" placeholder="nova senha"><input id="fbN2" type="password" autocomplete="new-password" placeholder="repita a nova senha">'+
        '<button id="fbBt">Salvar senha</button>'+(obrigatorio?'':'<button class="lk" id="fbCanc">Cancelar</button>')+'<div class="msg" id="fbMsg"></div>');
      const n1=d.querySelector('#fbN1'), n2=d.querySelector('#fbN2'), bt=d.querySelector('#fbBt'), m=d.querySelector('#fbMsg');
      const salvar=async()=>{
        if(n1.value.length<8){m.className='msg err';m.textContent='Use pelo menos 8 caracteres.';return}
        if(n1.value!==n2.value){m.className='msg err';m.textContent='As duas senhas não são iguais.';return}
        bt.disabled=true; m.className='msg'; m.textContent='Salvando…';
        try{await u.updatePassword(n1.value); try{await fs.collection('acessos').doc(u.uid).update({trocarSenha:false})}catch{}
          if(perfil) perfil.trocarSenha=false; d.remove(); ok(true)}
        catch(x){m.className='msg err';m.textContent=msgErro(x);bt.disabled=false}
      };
      bt.onclick=salvar; n2.onkeydown=ev=>{if(ev.key==='Enter')salvar()};
      const c=d.querySelector('#fbCanc'); if(c) c.onclick=()=>{d.remove();ok(false)};
      setTimeout(()=>n1.focus(),30);
    });
  }

  auth.onAuthStateChanged(async u=>{
    if(!u){entrar();return}
    let g=null, falha=null; try{g=await fs.collection('acessos').doc(u.uid).get()}catch(x){falha=x;console.warn('acessos',x)}
    if(falha){await auth.signOut();entrar('Não foi possível conferir o acesso ('+msgErro(falha)+'). Tente de novo.',true);return}
    if(!g.exists){   // conta antiga liberada por um admin: vincula agora
      try{const em=u.email.toLowerCase(), pd=await fs.collection('acessosPendentes').doc(em).get();
        if(pd.exists){const v=pd.data(); await fs.collection('acessos').doc(u.uid).set({email:em,nome:v.nome||'',nivel:v.nivel==='admin'?'admin':'usuario',empresa:v.empresa||'',trocarSenha:false,criadoPor:v.criadoPor||'',em:v.em||Date.now()});
          await fs.collection('acessosPendentes').doc(em).delete(); g=await fs.collection('acessos').doc(u.uid).get()}}catch(x){console.warn('pendente',x)}
    }
    if(!g.exists){await auth.signOut();entrar('A conta '+u.email+' não tem acesso ao sistema. Fale com um administrador.',true);return}
    perfil={...g.data(),uid:u.uid};
    if(perfil.trocarSenha) await definirSenha(u,true);
    try{await fs.collection('acessos').doc(u.uid).update({ultimoAcesso:Date.now()})}catch{}
    document.getElementById('fbLogin')?.remove();
    pronto(u);
  });

  /* cria a conta de outra pessoa sem trocar a sessão atual: usa uma segunda instância do app */
  async function criarConta(email,senha){
    const aux=firebase.apps.find(a=>a.name==='aux')||firebase.initializeApp(CFG,'aux');
    const r=await aux.auth().createUserWithEmailAndPassword(email,senha);
    const uid=r.user.uid; await aux.auth().signOut(); return uid;
  }
  function senhaProvisoria(){
    const A='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789', b=new Uint32Array(10); crypto.getRandomValues(b);
    return Array.from(b,x=>A[x%A.length]).join('');
  }

  const userApi={
    id:async()=>(await logado).uid,
    can:async()=>true,
    profiles:async ids=>{
      const r={}; for(const id of ids||[]){try{const g=await fs.collection('acessos').doc(id).get(); if(g.exists) r[id]={name:g.data().nome||g.data().email}}catch{}}
      return r},
  };
  const downloadsApi={save:async({filename,data})=>{
    const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data])), a=document.createElement('a');
    a.href=url;a.download=filename||'arquivo';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60e3);
    return {status:'saved'}}};

  if(window.FJA_FB_HOMOLOG){document.documentElement.classList.add('amb-dev'); document.title='HOMOLOGAÇÃO · Sistema FJA'}
  window.FJA_FIREBASE={auth,fs,pronto:logado,perfil:()=>perfil,admin:()=>perfil?.nivel==='admin',
    criarConta,senhaProvisoria,mensagemErro:msgErro,
    alterarSenha:()=>auth.currentUser?definirSenha(auth.currentUser,false):Promise.resolve(false),
    sair:()=>auth.signOut().then(()=>location.reload())};
  window.claude={use:async nome=>{
    await logado;
    if(nome==='db') return fs;
    if(nome==='user') return userApi;
    if(nome==='downloads') return downloadsApi;
    if(nome==='mcp'&&window.FJA_GOOGLE) return window.FJA_GOOGLE.mcp;
    if(nome==='assets'&&window.FJA_GOOGLE) return window.FJA_GOOGLE.assets;
    throw new Error(nome+' indisponível na versão Firebase');
  }};
})();
</script>
